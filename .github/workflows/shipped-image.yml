# The shipped team-server image, built and started.
#
# This file exists because of a measurement, not a policy. The first time
# anyone built `software/c2/Dockerfile` on a machine that was not the one
# it was written on, it failed six different ways. Four of those failures
# hit every architecture, and they had been there long enough that the
# image's own base had changed Debian release underneath it. Nothing in
# this repository ever built it, so nothing ever said so.
#
# A separate workflow rather than a job inside ci.yml, deliberately: this
# guards one artefact, it is the only thing that needs Docker and a long
# apt step, and a reader looking at a red run should be able to tell from
# the name alone that the image is what broke.
#
# It builds AND starts. Defect 5 built cleanly and then died at import
# with "No module named 'software'", so a job that stopped at a green
# build would have reported success over an image that could not run.
# That is the whole reason for the second step.
name: Shipped image

on:
  push:
    branches: ["**"]
    paths:
      - "software/c2/Dockerfile"
      - "software/c2/docker-compose.yml"
      - "software/c2/docker-entrypoint.sh"
      - "software/c2/server.py"
      - "software/c2/beacon.py"
      - ".github/workflows/shipped-image.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: build and start (docker, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Both architectures, because the defect this file now guards was
    # arm64-only and invisible on x86_64. aardwolf has a published
    # manylinux x86_64 wheel, so the Dockerfile's wheels stage compiles
    # nothing there -- an x86-only job would have stayed green with the
    # whole stage deleted, and would have proved the fix on the one
    # architecture that never needed it.
    #
    # `ubuntu-24.04-arm` is a standard GitHub-hosted runner, free and
    # unlimited on public repositories. Native, not QEMU: under emulation
    # the two PyO3 crates plus the toolchain download would be a real
    # risk against the timeout below, and a timeout reads like a product
    # fault.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            # Pinned, like ci.yml's two jobs. This one floated on
            # `ubuntu-latest` while the arm64 row beside it named a
            # release, and a floating runner is how this repository's CI
            # already changed underneath it once (ce6a73e). This job needs
            # no particular Python, so the specific failure cannot repeat
            # -- but the pattern is the scar, and the asymmetry with the
            # row below was the recorded leftover.
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # The apt step alone pulls ~140 MB and the NetExec install compiles,
    # so this is not a two-minute job. Measured locally at 8-14 minutes
    # from a cold cache, and the arm64 run also builds aardwolf's two
    # Rust crates.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: What docker is here
        run: |
          docker --version
          echo "runner arch: $(uname -m)"

      # The context is the repository root, because the image needs the
      # software/ package: server.py imports software.c2.listeners and
      # software.c2.stagers. Building with a context of software/c2 is
      # exactly what made the image unable to start.
      - name: Build software/c2/Dockerfile
        run: |
          docker build \
            -f software/c2/Dockerfile \
            -t raccoon-c2:ci \
            .

      # Not a smoke test of the entrypoint: this runs the module the way
      # the entrypoint runs it, so every top-level import in server.py is
      # executed. --help returns 0 and exits, which is all that is needed
      # to prove the imports resolve inside the image.
      - name: The server starts inside the image
        run: |
          docker run --rm --entrypoint python3 raccoon-c2:ci \
            -m software.c2.server --help > /tmp/help.txt
          echo "--- first lines of --help:"
          head -5 /tmp/help.txt
          grep -q -- "--operator-port" /tmp/help.txt

      # Reported, not asserted -- with one exception. Which of these
      # resolve depends on the runner's architecture, so this prints the
      # truth rather than demanding a particular answer. The entrypoint's
      # banner is built the same way for the same reason.
      #
      # NetExec is the exception, and it is asserted in its own step
      # below: it used to be the thing this step was reporting as absent.
      - name: What the image actually carries
        run: |
          docker run --rm --entrypoint sh raccoon-c2:ci -c '
            for t in nmap xfreerdp xfreerdp3 vncviewer responder \
                     relayking nxc secretsdump.py; do
              if command -v "$t" >/dev/null 2>&1; then
                printf "  %-18s %s\n" "$t" "$(command -v "$t")"
              else
                printf "  %-18s absent\n" "$t"
              fi
            done
            python3 - <<PY
          import importlib
          for name in ("impacket", "ldap3", "lsassy", "flask",
                       "cryptography", "requests_ntlm"):
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  print("  %-18s ABSENT (%s)" % (name, type(exc).__name__))
              else:
                  print("  %-18s ok" % name)
          PY
          '

      # ── NetExec, asserted ──
      #
      # This was a report line until the wheels stage existed. aardwolf
      # publishes no Linux aarch64 wheel, so on arm64 the image built
      # green with no `nxc` in it -- and the agent runs admitted commands
      # on this host (software/agent/executor/server_tool.py), so an
      # eight-phase campaign hit "command not found" at run time.
      #
      # The Dockerfile's install still ends in `|| echo`, which is right:
      # one tool must not cost every architecture its image. This step is
      # the other half of that bargain. A failed wheel build now turns
      # one job red instead of shipping a quietly incomplete image.
      # ── NetExec, asserted ──
      #
      # This was a report line until the wheels stage existed. aardwolf
      # publishes no Linux aarch64 wheel, so on arm64 the image built
      # green with no `nxc` in it -- and the agent runs admitted commands
      # on this host (software/agent/executor/server_tool.py), so an
      # eight-phase campaign hit "command not found" at run time.
      #
      # The Dockerfile's install still ends in `|| echo`, which is right:
      # one tool must not cost every architecture its image. This step is
      # the other half of that bargain. A failed wheel build turns a job
      # red instead of shipping a quietly incomplete image.
      #
      # Three checks, and none of them gates on nxc's exit status.
      # Measured in the built image: `nxc --version` prints the version
      # and then exits 1, because upstream's nxc/cli.py calls
      # sys.exit(1) right after the print. A `run:` step is bash -e, so
      # gating on the status would fail this job on every run, including
      # a perfect one -- and the first person to see that would append
      # `|| true` and reopen the hole. docker-entrypoint.sh already knew
      # this about relayking and ignores its status for the same reason.
      #
      # The import is the point of the whole change and is checked
      # separately because the version is not enough: with aardwolf moved
      # aside inside the venv, `nxc --version` still prints and `nxc rdp
      # --help` still exits 0. Only an import sees it.
      - name: NetExec resolves, and carries the library this stage builds
        run: |
          docker run --rm --entrypoint sh raccoon-c2:ci -c '
            command -v nxc >/dev/null 2>&1 || {
              echo "nxc is absent from the image"; exit 1; }
            nxc --version 2>&1 | grep -qE "[0-9]+\.[0-9]+\.[0-9]+" || {
              echo "nxc did not print a version"; exit 1; }
            /opt/pipx/venvs/netexec/bin/python -c "import aardwolf, arc4" || {
              echo "NetExec is installed without its RDP library"; exit 1; }
            echo "nxc: $(nxc --version 2>&1 | head -1)"
          '

      # ── Responder, asserted, and the reason it is a step of its own ──
      #
      # The step above prints what `command -v` finds, and for Responder
      # that reads a symlink the image makes whether or not the tool can
      # start. Measured in the built image on 2026-11-28: `responder
      # --help` answered "You need to install python3-netifaces", and then
      # "You need to install aioquic" -- its two requirements, neither of
      # which the image installed. So Responder had never been able to run
      # in the shipped image, and nothing here could tell.
      #
      # It is asserted on both architectures because `netifaces` is a C
      # extension and builds from source on aarch64, which is exactly the
      # shape of the defect the NetExec assertion below exists for.
      - name: Responder starts, not just resolves
        run: |
          docker run --rm --user 0:0 --entrypoint sh raccoon-c2:ci -c '
            command -v responder >/dev/null 2>&1 || {
              echo "responder is absent from the image"; exit 1; }
            responder --help > /tmp/r.txt 2>&1 || {
              echo "responder --help failed:"; cat /tmp/r.txt; exit 1; }
            grep -qi "responder" /tmp/r.txt || {
              echo "responder printed nothing it should"; cat /tmp/r.txt;
              exit 1; }
            python3 -c "import netifaces, aioquic" || {
              echo "Responder is installed without its requirements";
              exit 1; }
            echo "responder: starts, and its two requirements import"
          '

      # ── The image does not run as root by default ──
      #
      # The compose service asks for root in one line because Responder
      # needs raw sockets; the image's own default must not. A plain
      # `docker run` is what this checks, which is the path that does not
      # go through compose.
      - name: The image's default user is not root
        run: |
          who=$(docker run --rm --entrypoint id raccoon-c2:ci -un)
          echo "default user: $who"
          [ "$who" != "root" ] || { echo "the image defaults to root"; exit 1; }
          docker run --rm --entrypoint sh raccoon-c2:ci -c \
            'touch /data/raccoon-c2/probe' || {
              echo "that user cannot write the data directory"; exit 1; }

      # The compose file is the documented way to run this, and its build
      # context is part of the defect that stopped the server from
      # starting. A config parse catches a broken context or a renamed
      # dockerfile path without a second full build.
      - name: docker-compose.yml still resolves
        working-directory: software/c2
        run: docker compose config --quiet
