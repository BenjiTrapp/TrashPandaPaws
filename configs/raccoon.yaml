# ── Device Mode ──
# Single switch that controls cover identity, hostname, MAC prefix,
# and all protocol emulation. Everything below adapts to this value.
# Valid: "cisco_phone", "hp_printer"
device_mode: "cisco_phone"

network:
  upstream_iface: "eth0"
  downstream_iface: "eth1"
  bridge_name: "br0"
  bridge_mac: "auto"
  # Static IP for management (on br0). Set to "dhcp" for auto.
  management_ip: "dhcp"

nac_bypass:
  enabled: false
  discovery_timeout: 120
  nat_port_range: "61000-62000"

sniffer:
  enabled: true
  capture_dir: "/opt/raccoon/captures"
  max_pcap_size_mb: 50
  max_total_size_mb: 500
  rotate_count: 10
  bpf_filter: ""
  encrypt_captures: false
  gpg_recipient: ""
  # Interesting traffic filters (applied in addition to bpf_filter)
  capture_profiles:
    - name: "credentials"
      filter: "tcp port 21 or tcp port 23 or tcp port 25 or tcp port 110 or tcp port 143 or tcp port 445"
      enabled: true
    - name: "http"
      filter: "tcp port 80 or tcp port 8080 or tcp port 8443"
      enabled: true
    - name: "dns"
      filter: "udp port 53"
      enabled: false
    - name: "all"
      filter: ""
      enabled: false

cover:
  enabled: true
  # Device profiles — the active one is selected by device_mode (top of file)

  # Cisco IP Phone 7960 profile
  cisco_phone:
    hostname: "SEP001BD5A1B2C3"
    model: "Cisco IP Phone 7960"
    firmware: "P0S3-08-12-00"
    # Cisco OUI: 00:1B:D5
    mac_prefix: "00:1b:d5"
    http_port: 80
    sip_port: 5060
    rtp_port: 10000

  # HP Color LaserJet Pro MFP M478 profile
  hp_printer:
    hostname: "HP-LaserJet-M478"
    model: "HP Color LaserJet Pro MFP M478fdw"
    firmware: "2411C_001.2434A"
    # HP OUI: 00:1E:0B
    mac_prefix: "00:1e:0b"
    http_port: 80
    pjl_port: 9100
    lpd_port: 515
    ipp_port: 631
    snmp_port: 161
    telnet_port: 23

c2:
  enabled: true

  # ── Primary: Sliver Beacon (Go binary, compiled for linux/arm64) ──
  sliver:
    # Exclusive with the autonomous agent (see `agent:` at the end of this
    # file): a Sliver-managed box never checks in to the Raccoon server, so
    # with this true the agent reports itself unavailable. Set false to run the
    # Python beacon the agent drives.
    enabled: true
    implant_path: "/opt/raccoon/bin/implant"
    # Optional: staging URL to download implant on first boot
    staging_url: ""
    staging_key: ""
    # SHA256 of the expected binary (integrity check, leave empty to skip)
    sha256: ""
    restart_delay_seconds: 30
    # 0 = unlimited restarts
    max_restarts: 0

  # ── Fallback: Custom Python beacon (if Sliver binary unavailable) ──
  #
  # THIS HOST AS A CLIENT. Every block below describes a channel the implant
  # running here will try, in this order, until one answers. Do not confuse it
  # with `c2.listeners` further down, which opens sockets instead.
  fallback:
    enabled: true
    https:
      enabled: true
      callback_url: "https://c2.example.com/api/v1/beacon"
      verify_ssl: false
    dns:
      # Tasking only. Nothing registers over DNS and no result ever comes
      # back over it, so a task delivered this way is fire-and-forget: it
      # leaves the queue on delivery and its outcome is never reported.
      # Useful as a last resort for a host that can still resolve names.
      enabled: true
      domain: "c2.example.com"
      resolver: "8.8.8.8"
    smb:
      # Bidirectional, including registration. `server` is host:port; 445 is
      # the default and needs no port. Reaches an SMB listener (see
      # c2.listeners), not a Windows file server.
      enabled: false
      server: ""
      pipe_name: "msrpc_6e2f"
    quic:
      # UDP, bidirectional. Not real QUIC: a length-prefixed framing over
      # datagrams that looks like it on a flow record, which is the point.
      enabled: false
      server: ""
    gsocket:
      # The fifth leg, and the only one with no address to configure: a
      # `gs-netcat` child here and a carrier beside the team server's beacon
      # socket both dial *out* to the Global Socket Relay Network and are
      # introduced to each other by a shared secret. So this leg survives the
      # case the four above share -- the callback URL, the DNS zone, the SMB
      # host and the QUIC host blocked or burned at once -- and it needs no
      # inbound port and no name an investigator can pivot from this disk to
      # the operator's infrastructure.
      #
      # WARNING: read the GSRN section of docs/LISTENERS.md before enabling
      # this on an engagement. The relay network is a third party, so a
      # client's traffic crosses infrastructure nobody in this project
      # operates, and whether that is allowed is a question for the rules of
      # engagement rather than for a default in a file. It also hides *where*
      # the C2 is and not *that* gsocket is in use.
      #
      # Hardware implant only. A build the team server generates cannot carry
      # this leg -- it is a single file that spawns no child -- and the
      # generator refuses an enabled one with a reason rather than producing a
      # build whose fifth leg silently does nothing.
      enabled: false
      # The secret is this leg's whole address on the relay network, so it is
      # not here: a config file is something people paste into tickets. It
      # names a file instead, so `gs-netcat` can be handed `-k <path>` rather
      # than `-s <secret>`, which would put the credential in a world-readable
      # `ps` line. 0600, one secret per implant, minted with `gs-netcat -g`.
      #
      # Empty here, and it stays empty until somebody writes that file: this
      # is the one step of the leg nothing in the repository automates. The
      # build generator does not write it -- the generator is what *refuses*
      # this leg -- and the team server's secret store only writes its own
      # carrier's copy. So the implant's copy is created by hand (0600, the
      # secret and no trailing newline) and named here. The GSRN section of
      # docs/LISTENERS.md gives both commands.
      #
      # A bare key reads as None, which counts as absent and is allowed only
      # while the leg is disabled -- the same rule c2.encryption_key states a
      # screen below.
      secret_file:
      # Installed into the image by software/setup/build_image.sh at *build*
      # time, from a pinned release with the digest below. Never fetched on
      # the target: an implant that downloaded a binary at runtime would make
      # a request nobody configured, from the host that can least afford one.
      binary_path: "/opt/raccoon/bin/gs-netcat"
      # gs-netcat 1.4.43, linux-aarch64, verified before every exec. Empty
      # would mean "do not verify", the meaning c2.sliver.sha256 has; it is
      # filled because the leg hands this binary the secret that fronts the
      # beacon socket, so "some gs-netcat is there" is not the question worth
      # answering. Keep it in step with GSNETCAT_SHA256 in build_image.sh.
      sha256: "d4a7dfda2303fd0203d9bd2f29f8f2ee28dc2c42176f6a3ab37566aad1d5f117"
      # The five settings below are written out rather than left to their
      # defaults, because each is refused when written as a bare key: a
      # `scheme:` with nothing after it reads as None, and None counts as
      # "absent" only for the three path-ish settings above.
      #
      # The scheme the beacon builds its URL against, aimed at its own
      # forward. http, because the team server's --ssl is off by default and
      # every relay_url below is http://127.0.0.1:8443: the forward lands on
      # that same socket. Confidentiality on the hop rests on the SRP/AES-256
      # session gsocket negotiates end to end and the AES-256-GCM envelope
      # inside it, neither of which any carrier can read.
      scheme: "http"
      # The port the child forwards from, which the beacon then addresses on
      # 127.0.0.1. It binds *every* interface, not loopback: measured in
      # gs-netcat's own source at v1.4.43, and the tool has no bind-address
      # flag. software/setup/gsocket_forward_firewall.sh closes it to
      # everything but this host, from both provisioning paths; the GSRN
      # section of docs/LISTENERS.md carries the citation and the reasons.
      # There is nothing special about 16443 beyond its not colliding with
      # anything else this host listens on.
      local_port: 16443
      # Zero would restart the child as fast as gs-netcat can fail -- a busy
      # loop on the implant's CPU and a flood of joins on the relay network,
      # both loud in exactly the place an implant has to be quiet.
      restart_delay_seconds: 30
      # 0 = unlimited, the meaning c2.sliver.max_restarts has above.
      max_restarts: 0
      # How long a cycle will block waiting for a freshly started carrier's
      # forward to accept. Measured from the start, and the latch starts the
      # carrier at the end of a failed cycle -- a whole beacon interval
      # earlier -- so on the tasking path the window has closed and the leg
      # gets one connect attempt. The arm that really waits is the
      # re-registration every fifth failed cycle, which starts the carrier
      # and then tries to register over it in the same pass.
      ready_timeout_seconds: 20

  # ── Egress decider: THIS HOST DECIDING FOR ITSELF AS A CLIENT ──
  #
  # The client side, like c2.fallback above it. What an implant that cannot
  # reach its team server may try on its own, in this order, when no operator
  # and no server-side model can be reached to decide for it. The thing that
  # normally decides -- the agent's `try_egress` -- sits on the far side of
  # exactly the connection being established, so when the device is dropped
  # it cannot be asked. This block is the fallback for that one case, and it
  # is for nothing else.
  #
  # Read docs/EGRESS_DECIDER.md before enabling it. Every row here is an
  # action the implant takes with nobody watching, and the gate on what a
  # row may try is in the beacon's code and not in this file: configuration
  # chooses from the verbs `EGRESS_VERBS` names and orders them, and cannot
  # add one. In particular it may never `sleep` -- the one verb the model
  # reaches for on a stuck beacon, and the one an implant deciding for
  # itself must not have.
  #
  # Drop-box only. A build the team server generates carries no decider and
  # reads none of this; this block is read by the Pi's beacon from the file,
  # like c2.fallback above.
  #
  # Ships disabled: a fresh checkout decides nothing. The rules below are a
  # draft the operator can switch on by changing one word, and they are
  # validated whether the block is enabled or not, so a typo surfaces now
  # rather than on the stuck cycle it would have fired.
  egress_decider:
    enabled: false
    # At most this many autonomous attempts per stuck window. The window
    # closes -- and the budget is refilled -- when any upstream leg
    # delivers. Three, one per verb.
    budget: 3
    # The first rule whose condition holds, and whose verb this build can
    # run, is the one attempt. A `when` lists the rescue classes of named
    # transports, the record's flags, or `any` transport carrying one of a
    # set of classes; several keys in one `when` all have to hold.
    rules:
      # A proxy answered but refused us: re-run discovery for another.
      - when: {https: [auth_required, http_status]}
        try: rediscover
      # Discovery has already found a proxy we are not using: select it.
      - when: {flags: [proxy_found]}
        try: proxy
      # Nothing out there answered at all: bring the gsocket carrier up now
      # rather than waiting for the latch. A first rule of `gsocket` instead
      # would bring it up a cycle sooner, at the cost of not trying a proxy
      # first -- see the one-cycle cost in docs/EGRESS_DECIDER.md.
      - when: {any: [timed_out, unreachable]}
        try: gsocket

  # ── The way out: THE SCOUT, AND THE LADDER THAT IS ARITHMETIC ──
  #
  # The egress decider above reads five lines of evidence and orders three
  # verbs by hand. This block widens both: a second process -- the scout,
  # software/scout/, started by services/raccoon-scout.service -- watches a
  # narrow slice of the tapped port, and the beacon gates every move behind
  # an expected-value inequality instead of behind the operator's ordering.
  #
  # Read docs/WAY_OUT.md before enabling it. The quiet rungs are reversible;
  # the last one takes the downstream host's identity and can end this
  # implant's connectivity for good, with nobody's hand on the device.
  #
  # Drop-box only, like the decider: a build the team server generates is a
  # single file with no raccoon.yaml, no venv and no scout, and keeps exactly
  # today's behaviour.
  #
  # Ships disabled, and the rest of the block is read and validated anyway,
  # so a typo surfaces now rather than on the stuck cycle it would have
  # fired.
  way_out:
    enabled: false
    # Where the beacon and the scout meet. SIX files live here -- the
    # beacon's stuck window and its rung-4 request, the scout's document,
    # borrow file and trail, and dhclient's lease -- all 0600 in a 0700
    # directory. docs/WAY_OUT.md has the table and says what each one is.
    #
    # NOT under /tmp, and the beacon refuses a /tmp path by name:
    # raccoon-beacon.service and raccoon-implant.service both set
    # PrivateTmp=true, so each process would get its own private /tmp and
    # the handoff would silently never happen.
    state_dir: "/opt/raccoon/state"
    # Fresh or ignored. A scout document older than this is not read, so a
    # dead scout degrades to the five lines of evidence the decider already
    # had rather than to a stale decision -- and so a model too slow for
    # this hardware costs the rescue nothing.
    document_max_age_seconds: 900
    # The curve. `points` in the risk table is the value of what an action
    # unlocks, and the value of a restored channel is not constant: a
    # channel back in the first hour is worth a check-in, and one back after
    # a week is the difference between an operation and a dead device in a
    # rack. This is what makes the ladder move -- the quiet rungs are
    # allowed almost immediately and the loud ones cross the threshold
    # later, by arithmetic rather than by a policy line.
    points_per_hour: 5
    points_max: 100
    # The inequality is `points * p_success > risk_coefficient * p_detect`.
    # These two are the shipped agent profile's numbers; a drop-box has no
    # campaign configuration, so they are here rather than in a risk
    # profile.
    risk_coefficient: 33
    ev_threshold: 0
    # How the tap's two flags move the detection probability. A port that
    # authenticates is a port somebody configured and therefore watches, so
    # dot1x_seen pushes the identity rung later; a network that redirects
    # every browser sees credential prompts answered all day, so
    # portal_answered brings the borrow rung earlier.
    dot1x_detect: 0.15
    portal_detect: -0.10
    # ── The local model ──
    #
    # The scout asks one question -- which rung, on this evidence -- and
    # validates the answer against the verbs the implant actually has. The
    # beacon never calls the model and never waits for it: it reads the file
    # above, and ignores a stale one.
    #
    # SHIPS OFF, and not out of timidity. What inference costs on a Pi
    # powered over PoE -- watts, seconds, thermal headroom -- is not
    # measured anywhere in this repository and cannot be: there is no
    # device. So the first operator to switch this on is the first
    # measurement, and it should be a deployment that can be power-cycled.
    model:
      enabled: false
      # Loopback only, and the beacon refuses anything else by name. The
      # model exists for this implant's own decision; a listener reachable
      # from the target segment would hand it to anyone on the network the
      # implant is hiding in.
      endpoint: "http://127.0.0.1:11434"
      # Pulled by hand on the device, as the gsocket secret is. Empty, and
      # an enabled model with no name is refused: the scout would have
      # nothing to ask.
      name: ""
      timeout_seconds: 120

  beacon_interval_seconds: 300
  jitter_percent: 20
  # The shared secret for beacon traffic: a base64-encoded 32-byte AES-256-GCM
  # key, the same one the team server is started with (--key).
  # Required while fallback.enabled is true; the implant refuses to start
  # without a valid one. There is no default.
  # Generate with: python3 -c "import os,base64; print(base64.b64encode(os.urandom(32)).decode())"
  encryption_key: ""

  # ── Listeners: sockets THIS HOST OPENS for beacons to reach ──
  #
  # THIS HOST AS A SERVER, and the opposite of `c2.fallback` above. A listener
  # is a separate process that relays opaque ciphertext to the team server's
  # agent socket and the answer back; it never holds the encryption key, which
  # is why it can sit on a cheap forwarding host.
  #
  # All three ship disabled. A fresh checkout opens no socket nobody asked
  # for, and a listener block is validated even while disabled, so a typo
  # surfaces now rather than on the day somebody switches it on.
  #
  # `relay_url` is the team server's beacon socket. The DNS listener is the
  # exception: it takes the socket root, because it reads tasking from
  # /api/v1/dns/<id> and needs the listener token to do it. That token is a
  # shared secret and is deliberately not in this file -- it comes from the
  # environment, like the agent token.
  listeners:
    - name: smb-445
      transport: smb
      enabled: false
      bind_host: "0.0.0.0"
      bind_port: 445
      relay_url: "http://127.0.0.1:8443/api/v1/beacon"
      settings:
        pipe_name: "msrpc_6e2f"
    - name: quic-8445
      transport: quic
      enabled: false
      bind_host: "0.0.0.0"
      # Not 8443: that is the team server's own beacon socket. UDP and TCP
      # would not actually collide, but an example that reads as a conflict
      # is an example somebody copies.
      bind_port: 8445
      relay_url: "http://127.0.0.1:8443/api/v1/beacon"
    - name: dns-53
      transport: dns
      enabled: false
      bind_host: "0.0.0.0"
      bind_port: 53
      relay_url: "http://127.0.0.1:8443"
      settings:
        zone: "c2.example.com"

  # ── gsocket carriers: THIS HOST AS A GSOCKET SERVER ──
  #
  # The far end of `c2.fallback.gsocket` above, and its opposite in exactly
  # the way `c2.listeners` is the opposite of `c2.fallback`: one `gs-netcat`
  # per implant, listening on the Global Socket Relay Network under that
  # implant's secret and forwarding whatever arrives into this host's own
  # beacon socket. Configuring a leg here, or a carrier up there, is the
  # mistake the two blocks' matching key names invite -- and the symptom is a
  # process that joins the relay network and waits for ever for a peer that
  # is listening somewhere else.
  #
  # It is not a `c2.listeners` entry: a carrier opens no socket, so it has no
  # bind host, no bind port and nothing for the panel's port column to show.
  # It is supervised by the team server all the same, with its own row in the
  # 📡 panel; `services/raccoon-gsocket.service` is for a host that wants one
  # without the panel.
  #
  # Ships empty, and the empty list is the whole point: a carrier joins a
  # third-party relay network, and nothing should join one because a file
  # happened to mention it. A configured entry is validated whether it is
  # enabled or not, and a block the validators refuse stops the team server
  # at startup with the offending value in the message.
  #
  # No secret here either. `identity` is a *name*, looked up in the team
  # server's secret store (<data dir>/gsocket/secrets.json), which writes the
  # credential to a 0600 file and hands the carrier `-k <path>`. One secret
  # per implant, never fleet-wide: see docs/LISTENERS.md for why a recovered
  # implant image must not dial anything but its own carrier.
  gsocket_carrier: []
    # - name: implant-01
    #   # Which implant's secret this carrier listens under, as registered
    #   # in the secret store. Two carriers may not share one.
    #   identity: implant-01
    #   enabled: false
    #   # Where to connect what arrives: this host's beacon socket. A
    #   # destination for `gs-netcat -d`, not an address to bind -- a
    #   # wildcard here is a bind_host copied out of c2.listeners.
    #   beacon_host: "127.0.0.1"
    #   beacon_port: 8443
    #   binary_path: "/opt/raccoon/bin/gs-netcat"
    #   sha256: "d4a7dfda2303fd0203d9bd2f29f8f2ee28dc2c42176f6a3ab37566aad1d5f117"

  # ── Reverse SOCKS tunnel, near end: THIS HOST AS A TUNNEL CLIENT ──
  #
  # The endpoint dials out to a tunnel server and carries the operator's
  # relays back, so a scan runs from this host's network. The exact opposite
  # of `c2.tunnel_server` below, which opens the socket this block connects
  # to -- and the key names do not say which is which, which is why each one
  # says so here. The same trap `c2.fallback` and `c2.listeners` carry.
  #
  # Ships disabled, like all three listeners: a fresh checkout dials nobody.
  #
  # This block is for a host configured by file -- the Pi, where
  # services/raccoon-tunnel.service starts the endpoint and there is no
  # beacon above it. A build generated by the team server carries the same
  # eight fields baked in and reads none of this.
  #
  # `c2.enabled` above is the master switch for this too: the endpoint
  # refuses to start while it is false, even on a host that runs nothing
  # else. One kill switch for everything that calls out.
  #
  # The PSK is deliberately not here. Under Noise_NKpsk0 the endpoint
  # presents no static key of its own, so the PSK plus the server's public
  # key is the entire credential, and a shared secret does not belong in a
  # file that is in git and will be pasted into a ticket -- the same rule
  # that keeps RACCOON_LISTENER_TOKEN out of this file. It comes from
  # RACCOON_TUNNEL_PSK, which the unit supplies through an EnvironmentFile,
  # and a `psk` key found here is refused by name rather than ignored.
  tunnel:
    enabled: false
    # The tunnel server, written as this host's network can reach it.
    server: ""
    # One port serves the command channel and every relay, so a single
    # CONNECT rule is enough to cross a proxy.
    port: 8446
    # The tunnel server's static X25519 public key: 32 bytes, base64. Read
    # off the tunnel server's key store, which mints the pair on first use.
    public_key: ""
    # Which build this endpoint is. The server refuses a HELLO claiming
    # another one, and assigns this name's loopback SOCKS port against it.
    identity: ""
    keepalive_seconds: 30
    # Run on pure-Python AES-GCM (roughly 50-200 KB/s) rather than refusing
    # when the host has no libcrypto. A deliberate choice: every session
    # would otherwise look like a slow network for as long as anybody cared
    # to look.
    allow_slow_crypto: false

  # ── Reverse SOCKS tunnel, far end: THIS HOST AS A TUNNEL SERVER ──
  #
  # The socket endpoints dial in to, and the loopback SOCKS ports the
  # operator's tools connect to. The opposite side of `c2.tunnel` above:
  # switching this one on opens a listening socket, which is not what a
  # drop-box should ever do.
  #
  # It is not a listener and is deliberately not in `c2.listeners`: a
  # listener never holds the encryption key, which is what makes one safe on
  # a host you do not mind losing, and this process holds a Noise static
  # private key and every build's PSK. See docs/LISTENERS.md.
  #
  # Its key store is the team server's own, at <data dir>/tunnel/keys.json:
  # the generator registers each build's PSK there and this process reads
  # its candidates out of the same file.
  tunnel_server:
    enabled: false
    bind_host: "0.0.0.0"
    # Not 8443 or 8445: those are the team server's beacon socket and the
    # QUIC listener's example port.
    bind_port: 8446
    # Loopback SOCKS ports, one per connected endpoint, assigned from this
    # range and stable across restarts.
    socks_port_first: 19050
    socks_port_last: 19099
    # Loopback *shell* ports, one per connected endpoint, from a second
    # range that must not overlap the one above.
    #
    # WARNING: this port is a root shell on the implant host.
    #
    # Commented out, and that absence is the whole switch: set both and
    # every connected endpoint gets one, so it is opened because somebody
    # wrote these two lines and for no other reason. The port binds
    # 127.0.0.1 and needs the password the 🔌 panel shows beside it;
    # forwarding it to a workstation extends that reach to whatever can
    # reach the workstation's loopback.
    # shell_port_first: 19100
    # shell_port_last: 19149
    # Record each shell session's output here, one file per session, 0600
    # in directories 0700. Commented out, and that absence means nothing
    # is recorded and no directory is created. A transcript is a root
    # shell on someone's host written down: keep it where the rest of the
    # engagement's evidence is kept.
    # shell_transcript_dir: "/var/lib/raccoon-c2/transcripts"
    keepalive_seconds: 30

  # ── Egress proxy (Python fallback beacon) ──
  proxy:
    # auto   = discover from env vars, registry, PAC/WPAD
    # manual = always use the url below
    # none   = force a direct connection
    mode: "auto"
    url: ""

    # Corporate NTLM proxy authentication. Starts a loopback CONNECT relay that
    # performs the NTLMv2 handshake, then tunnels the beacon through it. Needed
    # when the proxy demands NTLM and the account lives in a different AD domain
    # than the proxy, which urllib/WinINet cannot handle on their own.
    ntlm:
      enabled: false
      # Upstream proxy. Leave host empty to reuse the auto-discovered proxy.
      host: ""
      port: 8080
      # Domain can also be supplied inline as "CORP\\user" or "user@corp.local"
      domain: ""
      username: ""
      password: ""
      # Workstation name sent in the NTLM Type 3 message. Empty = local hostname.
      workstation: ""

  # Exfiltration method: "dns" or "https"
  exfil_method: "https"
  exfil_chunk_size_bytes: 512

remote_access:
  ssh:
    ssh_enabled: true
    # Operator-controlled SSH server the implant connects back to
    ssh_remote_host: ""
    ssh_remote_port: 22
    ssh_remote_user: "raccoon"
    # Port opened on the operator server that tunnels back to the implant
    ssh_tunnel_port: 2222
    # Local sshd port on the implant (127.0.0.1 only)
    ssh_local_port: 22
    # Key type: ed25519 (recommended), rsa, ecdsa
    ssh_key_type: "ed25519"

  vnc:
    vnc_enabled: false
    # VNC binds to 127.0.0.1 only — access via SSH tunnel
    vnc_port: 5900
    vnc_password: "raccoon"
    vnc_resolution: "1024x768"

notifications:
  enabled: false
  slack:
    enabled: false
    webhook_url: ""
  discord:
    enabled: false
    webhook_url: ""
  teams:
    enabled: false
    webhook_url: ""

logging:
  log_dir: "/opt/raccoon/logs"
  max_size_mb: 5
  backup_count: 3
  console_level: "INFO"
  file_level: "DEBUG"

# ── Autonomous agent ──
# Optional LLM-driven campaign service (software/agent/). Off by default; the
# drop-box and the C2 behave exactly as before without it.
#
# Each setting resolves on its own: command line, then this file, then an
# environment variable (AGENT_<SETTING>), then a built-in default. An empty
# value here counts as unset, so it falls through to the environment.
#
# The agent is mutually exclusive with c2.sliver.enabled: a Sliver-managed
# drop-box runs the Sliver implant and never checks in to the Raccoon server,
# so the agent would face an empty beacon list. With sliver.enabled: true the
# agent reports itself unavailable (/api/ai/status says why) instead of
# starting. Set c2.sliver.enabled to false to drive the Python beacon.
agent:
  enabled: false

  # ── LLM ──
  # Secrets never go in this file, because this file is in git. The API key
  # comes from AGENT_API_KEY, or from the file named below, which must be
  # readable by its owner only (chmod 600) or the agent refuses to start. The
  # C2 and agent tokens come from RACCOON_TOKEN and RACCOON_AGENT_TOKEN.
  llm:
    # anthropic | bedrock | openrouter | opencode | local | ollama | gemini
    #          | vertex
    #
    # gemini takes the bare model id (gemini-3-pro) and a key; it needs no
    # base_url. Its free tier suits the last link of a fallbacks chain.
    #
    # bedrock reads AWS_BEARER_TOKEN_BEDROCK if no key is configured, and its
    # endpoint follows AWS_REGION; the model id carries its own region prefix
    # (eu., us.), so an EU id against a US endpoint fails at the first call.
    #
    # vertex takes a publisher-prefixed model id (google/gemini-3-pro) and no
    # key: it authenticates with a short-lived Google token. Its endpoint is
    # built from vertex_project and vertex_location below, so set no base_url.
    provider: ""
    # Required for every provider; there is no default that would not go stale.
    model: ""
    # Only for opencode (no built-in endpoint) or to point at another server.
    base_url: ""
    # e.g. /etc/raccoon/agent.key, outside the repository
    api_key_file: ""
    # vertex only. The Google Cloud project id; required.
    vertex_project: ""
    # vertex only. The region, which appears in both the host and the path of
    # the endpoint. Lowercase letters, digits and hyphens. Blank means
    # europe-west4. Left blank, not written out, because a value here outranks
    # AGENT_VERTEX_LOCATION in the environment.
    vertex_location: ""
    # vertex only. Where the access token comes from:
    #   auto | metadata | gcloud | file
    # auto tries the metadata server, then gcloud, then api_key_file. "file"
    # needs api_key_file and re-reads it, so a rotated token is picked up. A
    # key given with token_source left at auto is used as it stands and is
    # not refreshed: Google's tokens last about an hour. Blank means auto,
    # and is left blank for the same reason as vertex_location.
    token_source: ""
    # off  = token counts, latency and status only
    # full = also store prompt and response text (may contain scan results)
    llm_log_level: "off"

  # ── Service ──
  # Loopback only: the C2 proxies to it, and nothing else should reach it.
  service:
    bind_host: "127.0.0.1"
    bind_port: 8099

  # ── C2 the agent drives ──
  c2:
    url: "https://127.0.0.1:8444"
    # The C2 certificate is self-signed.
    verify_tls: false

  limits:
    max_concurrent_executors: 4
    # Seconds to wait for an operator's answer in supervised mode.
    approval_timeout: 300

  # ── Campaign defaults ──
  # What the campaign form is pre-filled with. Not read at runtime: the form
  # posts its values back and CampaignConfig.from_form falls back to the same
  # numbers, which a test keeps in step with this block. Risk numbers (EV
  # threshold, P(detect), detection budget, risk coefficient) come from
  # risk_profile: passive | normal | aggressive.
  defaults:
    risk_profile: "normal"
    # Phase 5 (exploitation) is off; Wifi phases follow beacon capabilities.
    phases: [1, 2, 3, 4]
    # What to do when a gated action needs an operator and none answers:
    # decide (expected-value arbiter) | skip | pause
    # The default depends on the mode. Supervised runs pause, because there
    # the operator is the arbiter and stepping away must not quietly hand
    # that to the expected-value check. Full Automated defaults to decide,
    # which is what makes it unattended. This block documents the
    # supervised default; set it explicitly to override either.
    unattended_behavior: "pause"
    max_runtime_seconds: 7200
    max_tokens_total: 500000
    # Beacon check-in interval during a run, and the one put back afterwards.
    campaign_interval: 15
    restore_interval: 300
    # supervised = operator approves each gated action; auto = unattended.
    mode: "supervised"
