# ── Device Mode ──
# Single switch that controls cover identity, hostname, MAC prefix,
# and all protocol emulation. Everything below adapts to this value.
# Valid: "cisco_phone", "hp_printer"
device_mode: "cisco_phone"

network:
  upstream_iface: "eth0"
  downstream_iface: "eth1"
  bridge_name: "br0"
  bridge_mac: "auto"
  # Static IP for management (on br0). Set to "dhcp" for auto.
  management_ip: "dhcp"

nac_bypass:
  enabled: false
  discovery_timeout: 120
  nat_port_range: "61000-62000"

sniffer:
  enabled: true
  capture_dir: "/opt/raccoon/captures"
  max_pcap_size_mb: 50
  max_total_size_mb: 500
  rotate_count: 10
  bpf_filter: ""
  encrypt_captures: false
  gpg_recipient: ""
  # Interesting traffic filters (applied in addition to bpf_filter)
  capture_profiles:
    - name: "credentials"
      filter: "tcp port 21 or tcp port 23 or tcp port 25 or tcp port 110 or tcp port 143 or tcp port 445"
      enabled: true
    - name: "http"
      filter: "tcp port 80 or tcp port 8080 or tcp port 8443"
      enabled: true
    - name: "dns"
      filter: "udp port 53"
      enabled: false
    - name: "all"
      filter: ""
      enabled: false

cover:
  enabled: true
  # Device profiles — the active one is selected by device_mode (top of file)

  # Cisco IP Phone 7960 profile
  cisco_phone:
    hostname: "SEP001BD5A1B2C3"
    model: "Cisco IP Phone 7960"
    firmware: "P0S3-08-12-00"
    # Cisco OUI: 00:1B:D5
    mac_prefix: "00:1b:d5"
    http_port: 80
    sip_port: 5060
    rtp_port: 10000

  # HP Color LaserJet Pro MFP M478 profile
  hp_printer:
    hostname: "HP-LaserJet-M478"
    model: "HP Color LaserJet Pro MFP M478fdw"
    firmware: "2411C_001.2434A"
    # HP OUI: 00:1E:0B
    mac_prefix: "00:1e:0b"
    http_port: 80
    pjl_port: 9100
    lpd_port: 515
    ipp_port: 631
    snmp_port: 161
    telnet_port: 23

c2:
  enabled: true

  # ── Primary: Sliver Beacon (Go binary, compiled for linux/arm64) ──
  sliver:
    # Exclusive with the autonomous agent (see `agent:` at the end of this
    # file): a Sliver-managed box never checks in to the Raccoon server, so
    # with this true the agent reports itself unavailable. Set false to run the
    # Python beacon the agent drives.
    enabled: true
    implant_path: "/opt/raccoon/bin/implant"
    # Optional: staging URL to download implant on first boot
    staging_url: ""
    staging_key: ""
    # SHA256 of the expected binary (integrity check, leave empty to skip)
    sha256: ""
    restart_delay_seconds: 30
    # 0 = unlimited restarts
    max_restarts: 0

  # ── Fallback: Custom Python beacon (if Sliver binary unavailable) ──
  #
  # THIS HOST AS A CLIENT. Every block below describes a channel the implant
  # running here will try, in this order, until one answers. Do not confuse it
  # with `c2.listeners` further down, which opens sockets instead.
  fallback:
    enabled: true
    https:
      enabled: true
      callback_url: "https://c2.example.com/api/v1/beacon"
      verify_ssl: false
    dns:
      # Tasking only. Nothing registers over DNS and no result ever comes
      # back over it, so a task delivered this way is fire-and-forget: it
      # leaves the queue on delivery and its outcome is never reported.
      # Useful as a last resort for a host that can still resolve names.
      enabled: true
      domain: "c2.example.com"
      resolver: "8.8.8.8"
    smb:
      # Bidirectional, including registration. `server` is host:port; 445 is
      # the default and needs no port. Reaches an SMB listener (see
      # c2.listeners), not a Windows file server.
      enabled: false
      server: ""
      pipe_name: "msrpc_6e2f"
    quic:
      # UDP, bidirectional. Not real QUIC: a length-prefixed framing over
      # datagrams that looks like it on a flow record, which is the point.
      enabled: false
      server: ""

  beacon_interval_seconds: 300
  jitter_percent: 20
  # The shared secret for beacon traffic: a base64-encoded 32-byte AES-256-GCM
  # key, the same one the team server is started with (--key).
  # Required while fallback.enabled is true; the implant refuses to start
  # without a valid one. There is no default.
  # Generate with: python3 -c "import os,base64; print(base64.b64encode(os.urandom(32)).decode())"
  encryption_key: ""

  # ── Listeners: sockets THIS HOST OPENS for beacons to reach ──
  #
  # THIS HOST AS A SERVER, and the opposite of `c2.fallback` above. A listener
  # is a separate process that relays opaque ciphertext to the team server's
  # agent socket and the answer back; it never holds the encryption key, which
  # is why it can sit on a cheap forwarding host.
  #
  # All three ship disabled. A fresh checkout opens no socket nobody asked
  # for, and a listener block is validated even while disabled, so a typo
  # surfaces now rather than on the day somebody switches it on.
  #
  # `relay_url` is the team server's beacon socket. The DNS listener is the
  # exception: it takes the socket root, because it reads tasking from
  # /api/v1/dns/<id> and needs the listener token to do it. That token is a
  # shared secret and is deliberately not in this file -- it comes from the
  # environment, like the agent token.
  listeners:
    - name: smb-445
      transport: smb
      enabled: false
      bind_host: "0.0.0.0"
      bind_port: 445
      relay_url: "http://127.0.0.1:8443/api/v1/beacon"
      settings:
        pipe_name: "msrpc_6e2f"
    - name: quic-8445
      transport: quic
      enabled: false
      bind_host: "0.0.0.0"
      # Not 8443: that is the team server's own beacon socket. UDP and TCP
      # would not actually collide, but an example that reads as a conflict
      # is an example somebody copies.
      bind_port: 8445
      relay_url: "http://127.0.0.1:8443/api/v1/beacon"
    - name: dns-53
      transport: dns
      enabled: false
      bind_host: "0.0.0.0"
      bind_port: 53
      relay_url: "http://127.0.0.1:8443"
      settings:
        zone: "c2.example.com"

  # ── Egress proxy (Python fallback beacon) ──
  proxy:
    # auto   = discover from env vars, registry, PAC/WPAD
    # manual = always use the url below
    # none   = force a direct connection
    mode: "auto"
    url: ""

    # Corporate NTLM proxy authentication. Starts a loopback CONNECT relay that
    # performs the NTLMv2 handshake, then tunnels the beacon through it. Needed
    # when the proxy demands NTLM and the account lives in a different AD domain
    # than the proxy, which urllib/WinINet cannot handle on their own.
    ntlm:
      enabled: false
      # Upstream proxy. Leave host empty to reuse the auto-discovered proxy.
      host: ""
      port: 8080
      # Domain can also be supplied inline as "CORP\\user" or "user@corp.local"
      domain: ""
      username: ""
      password: ""
      # Workstation name sent in the NTLM Type 3 message. Empty = local hostname.
      workstation: ""

  # Exfiltration method: "dns" or "https"
  exfil_method: "https"
  exfil_chunk_size_bytes: 512

remote_access:
  ssh:
    ssh_enabled: true
    # Operator-controlled SSH server the implant connects back to
    ssh_remote_host: ""
    ssh_remote_port: 22
    ssh_remote_user: "raccoon"
    # Port opened on the operator server that tunnels back to the implant
    ssh_tunnel_port: 2222
    # Local sshd port on the implant (127.0.0.1 only)
    ssh_local_port: 22
    # Key type: ed25519 (recommended), rsa, ecdsa
    ssh_key_type: "ed25519"

  vnc:
    vnc_enabled: false
    # VNC binds to 127.0.0.1 only — access via SSH tunnel
    vnc_port: 5900
    vnc_password: "raccoon"
    vnc_resolution: "1024x768"

notifications:
  enabled: false
  slack:
    enabled: false
    webhook_url: ""
  discord:
    enabled: false
    webhook_url: ""
  teams:
    enabled: false
    webhook_url: ""

logging:
  log_dir: "/opt/raccoon/logs"
  max_size_mb: 5
  backup_count: 3
  console_level: "INFO"
  file_level: "DEBUG"

# ── Autonomous agent ──
# Optional LLM-driven campaign service (software/agent/). Off by default; the
# drop-box and the C2 behave exactly as before without it.
#
# Each setting resolves on its own: command line, then this file, then an
# environment variable (AGENT_<SETTING>), then a built-in default. An empty
# value here counts as unset, so it falls through to the environment.
#
# The agent is mutually exclusive with c2.sliver.enabled: a Sliver-managed
# drop-box runs the Sliver implant and never checks in to the Raccoon server,
# so the agent would face an empty beacon list. With sliver.enabled: true the
# agent reports itself unavailable (/api/ai/status says why) instead of
# starting. Set c2.sliver.enabled to false to drive the Python beacon.
agent:
  enabled: false

  # ── LLM ──
  # Secrets never go in this file, because this file is in git. The API key
  # comes from AGENT_API_KEY, or from the file named below, which must be
  # readable by its owner only (chmod 600) or the agent refuses to start. The
  # C2 and agent tokens come from RACCOON_TOKEN and RACCOON_AGENT_TOKEN.
  llm:
    # anthropic | bedrock | openrouter | opencode | local
    #
    # bedrock reads AWS_BEARER_TOKEN_BEDROCK if no key is configured, and its
    # endpoint follows AWS_REGION; the model id carries its own region prefix
    # (eu., us.), so an EU id against a US endpoint fails at the first call.
    provider: ""
    # Required for every provider; there is no default that would not go stale.
    model: ""
    # Only for opencode (no built-in endpoint) or to point at another server.
    base_url: ""
    # e.g. /etc/raccoon/agent.key, outside the repository
    api_key_file: ""
    # off  = token counts, latency and status only
    # full = also store prompt and response text (may contain scan results)
    llm_log_level: "off"

  # ── Service ──
  # Loopback only: the C2 proxies to it, and nothing else should reach it.
  service:
    bind_host: "127.0.0.1"
    bind_port: 8099

  # ── C2 the agent drives ──
  c2:
    url: "https://127.0.0.1:8444"
    # The C2 certificate is self-signed.
    verify_tls: false

  limits:
    max_concurrent_executors: 4
    # Seconds to wait for an operator's answer in supervised mode.
    approval_timeout: 300

  # ── Campaign defaults ──
  # What the campaign form is pre-filled with. Not read at runtime: the form
  # posts its values back and CampaignConfig.from_form falls back to the same
  # numbers, which a test keeps in step with this block. Risk numbers (EV
  # threshold, P(detect), detection budget, risk coefficient) come from
  # risk_profile: passive | normal | aggressive.
  defaults:
    risk_profile: "normal"
    # Phase 5 (exploitation) is off; Wifi phases follow beacon capabilities.
    phases: [1, 2, 3, 4]
    # What to do when a gated action needs an operator and none answers:
    # decide (expected-value arbiter) | skip | pause
    # The default depends on the mode. Supervised runs pause, because there
    # the operator is the arbiter and stepping away must not quietly hand
    # that to the expected-value check. Full Automated defaults to decide,
    # which is what makes it unattended. This block documents the
    # supervised default; set it explicitly to override either.
    unattended_behavior: "pause"
    max_runtime_seconds: 7200
    max_tokens_total: 500000
    # Beacon check-in interval during a run, and the one put back afterwards.
    campaign_interval: 15
    restore_interval: 300
    # supervised = operator approves each gated action; auto = unattended.
    mode: "supervised"
