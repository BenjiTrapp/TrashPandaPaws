# ---------------------------------------------------------------------------
# Deliberately unconnected
# ---------------------------------------------------------------------------
no_connect:
  U3.28:
    reason: >
      REGOUT - internal switching regulator is disabled (ENSWREG low), so this
      output is unused. Decision 3f.
  U3.24:
    reason: >
      LED2 - not used. Green plus yellow are enough for link/activity. The
      polarity question that once blocked orange is answered (design_notes.
      led_polarity: push-pull, programmable level), so orange via anti-parallel
      drive of the bi-colour LED is possible - [OLIMEX] Rev E does it between
      LED0 and LED1 - but it needs two pins on opposite levels and is a choice
      left for later, not an open datasheet question. Pin 24 is "LED Mode
      (default)" in [RTL-DS] table 11, and an output (table 7), so leaving it
      open is correct.
  U3.31:
    reason: >
      EECS - no external EEPROM; the part has embedded eFUSE which the
      datasheet says it loads first ([RTL-DS] table 3 note 1, 6.4). EECS is an
      output (table 3, type O) and table 11 gives pin 31 no function outside
      EEPROM mode. The datasheet does not say in so many words that it may
      float; an unused output pin normally may, and [OLIMEX] Rev E ships with
      its EEPROM (U2) unpopulated, leaving this net unterminated.
  U4.4:
    reason: "AP2112K pin 4 is NC by datasheet."
  U7.5:
    reason: >
      TPS22810 QOD (quick output discharge): not used. The switch stays on in
      service, so there is no switch-off to discharge. [TPS22810] 6: 'disabling
      QOD by leaving pin floating'.
  U8.5:
    reason: "SP3019-04HTG pin 5 is not connected inside the part ([SP3019] page 1 block diagram; the 2022 revision states it)."

# ---------------------------------------------------------------------------
# Cross-cutting design notes
# ---------------------------------------------------------------------------
design_notes:
  vbus_inrush: >
    DECIDED 2026-11-01 (task 6), REWORKED after review. PROBLEM: the +5V net
    carried 21.2 uF (C1 10 + C2 0.1 + C3 10 + C5 1 + C18 0.1) directly on the
    connector. [SLYT118] table 1: the USB limit is 10 uF at the connector with
    at most 50 uC of inrush; USB 2.0 7.2.4.1 (as quoted via [SLYT118] and
    electrongen.blogspot.com; the USB-IF text itself was not read here): a
    device that needs more bypass capacitance 'must incorporate some form of
    VBUS surge current limiting'. 21.2 uF is twice the limit with nothing
    limiting the current.

    FIX, two parts. (a) Less capacitance on raw VBUS: C1 10 uF -> 1 uF, now
    the load switch's input capacitor. Raw VBUS holds C1 1 uF + C2 0.1 uF =
    1.1 uF, i.e. 5.8 uC at 5.25 V against the 50 uC limit; the 10 uF test in
    check_fab_release.py reads that net and passes on it. (b) The bulk (C3 10
    uF buck input, C5 1 uF LDO input, C18 100 nF) moved behind U7, a TPS22810
    load switch whose rise time is set by C26. That is NOT just a renamed net:
    check_fab_release.py also models the charging current into everything
    behind U7 and fails if capacitance is added there or C26 is removed. EN of
    U7 is tied to VIN, which [TPS22810] 9.3.3 endorses; VBUS settles in
    microseconds against an output ramp of about two milliseconds.

    MODEL (a model of the capacitive charging, in phases; check_fab_release.py
    repeats it, parameters are read from this file). Switch: CT = 27 nF, taken
    20 % low (21.6 nF) for X7R tolerance and bias: rise time 1806 us for 4 V
    by linear interpolation of the [TPS22810] table 2 entries for 10 nF (864
    us) and 27 nF (2245 us) at VIN = 5 V; slew 2215 V/s, 0 to 5 V in 2.26 ms.
    The slope is taken as constant over the whole ramp although the table
    covers only 10-90 %.

      phase 1, whole ramp .... +5V_SW itself: C3 10 + C5 1 + C18 0.1 = 11.1 uF x 2215 V/s = 24.6 mA
      phase 2, VIN < 3.55 V .. U4 is an LDO and its output tracks its input until dropout, so the
                               10.4 uF behind it (C6 10 + C7, C9, C10, C11 0.4) charges at the FULL
                               slew: 23.0 mA more, together 47.6 mA, for the first 1.6 ms
      phase 3, VIN > 2.5 V .... U6 starts at its UVLO ([SY8089] page 4, 2.5 V max) and brings its
                               22.5 uF (C4 22 + C12..C16 0.5) to 1.0 V in TSS = 1.2 ms (typ): 18.8 mA
                               out, input current = I_out x Vout/(Vin x 0.8), about 2.5 mA at VIN = 3.5 V,
                               under 5 mA throughout
      modelled peak ........... 50 mA at t = 1.6 ms (phases 1+2 plus the first of phase 3)
      ramp average ............ 42 mA (this is the number the first version of this note called
                               'inrush'; it is a LOWER BOUND on the peak, not the peak)

    THIS DOES NOT BOUND THE PEAK. Stated plainly, because the first version of
    this note claimed a margin that the evidence did not carry. (1) The SY8089
    note gives TSS as a TYPICAL value and the UVLO as a MAXIMUM only: nothing
    says the soft start is not four times faster or the converter starting at
    2.0 V or lower. Run through the same model: TSS/4 with a 2.0 V UVLO gives 83 mA; TSS/4 with the buck starting at 0.5 V gives 128 mA. (2) The model
    leaves out U3's own start-up load. U3 is powered through U4 from about 1.6
    ms on, and [RTL-DS] table 26 gives its operating current (Icc33 70 mA typ,
    Icc10 170 mA typ, heavy traffic) but nothing for power-up. Any of that
    adds to the charging current, and the USB attach test counts total current
    above 100 mA. (3) The 10-90 % table leaves out the first and last tenth of
    the ramp. So: 50 mA is the modelled capacitive peak under typical
    datasheet values; 42 mA is a ramp-average lower bound; the true peak is
    unbounded from committed evidence and could plausibly be higher. The guard
    in check_fab_release.py asserts the modelled peak stays under 100 mA,
    which is a NECESSARY condition only. There is no margin figure in this
    note, and none should be quoted from it.

    WHY 100 mA: the USB attach test counts only current above 100 mA as an
    inrush event (quoted at electrongen.blogspot.com from the USB test
    procedure; not read at USB-IF) and 100 mA is the low-power unit load
    ([SLYT118] table 1).

    ALSO NOT COVERED. (a) The steady current the board draws before the host
    has configured it: USB allows a SuperSpeed device 150 mA until configured
    (one USB 3.0 unit load, from memory of the specification, not checked
    against its text here); nothing in the committed documents gives the
    attach current. NOT ASSESSED. (b) Hot-plug overshoot: ceramic capacitors
    on an inductive cable ring up to roughly twice the supply on a hot plug. A
    TPS22918 (6 V absolute maximum) was rejected for that reason; U7 is rated
    20 V absolute maximum and 18 V operating, and U9 clamps raw VBUS from 6 V
    up. Not measured; TP2 is there to look at it. (c) Reverse conduction:
    [TPS22810] 10.4 recommends CIN greater than CL because of the body diode,
    here CL (11.1 uF) is ten times CIN (1.1 uF). On unplug +5V_SW runs down
    through the body diode into raw VBUS and the loads; nothing reaches the
    host, it has disconnected. If the host drops VBUS while still connected,
    +5V_SW can feed it for a few milliseconds. Accepted.

    FIRST BUILD (this is where the peak gets its bound): scope TP2 (raw VBUS)
    and TP3 (+5V_SW) together on plug-in, with a current probe or a 0.1 ohm
    resistor in the USB cable. Expect TP3 to ramp over roughly two
    milliseconds. Record the peak current; if it is over 100 mA the cures are
    a larger C26 (outside the datasheet table, so characterise it), a delayed
    enable for U6, or a smaller C4/C6.
  esd_protection: >
    ADDED 2026-11-01 (task 6). The board is plugged into somebody else's host;
    D+/D- and the SuperSpeed pairs had no protection at all. Chosen: U9
    USBLC6-2SC6 on D+/D- (also clamps VBUS) and U8 SP3019-04HTG on the four
    SuperSpeed lines, both at J3.

    SELECTION CRITERION FOR THE 90 OHM SUPERSPEED PAIRS: at most 0.5 pF per
    line, line to ground. Source: [TI-ESD] 4.2, 'The signal speeds can reach
    up to 5Gbps, a low-capacitance ESD diode with less than 0.5pF is
    recommended' (10 Gbit/s needs less than 0.3 pF). D+/D-: less than 4 pF
    ([TI-ESD] 3.2/4.2). First-order cross-check, my arithmetic and not a
    datasheet value: a shunt capacitance C on a line of Z0 = 45 ohm (half the
    90 ohm differential) has its corner at 1/(pi x Z0 x C): 0.3 pF -> 23.6
    GHz, 0.5 pF -> 14.1 GHz, 1.4 pF -> 5.0 GHz. The bit rate is 5 Gbit/s
    (Nyquist 2.5 GHz), so 1.4 pF is the physical ceiling and 0.5 pF leaves a
    factor 2.8 for pad, package and layout parasitics and for the P/N
    mismatch. U8: 0.3 pF typ I/O-to-GND at 3 GHz and 0.18 pF I/O-to-I/O
    ([SP3019]; no maximum is published, which is a gap, not a pass). U9: 3.5
    pF max ([USBLC6] table 2), under the 4 pF.

    HAND-SOLDERABLE: the low-capacitance arrays TI sells for this (TPD4E02B04
    0.25 pF, TPD4E05U06, TPD6E05U06 and others) are USON/DFN with no leads and
    cannot be soldered with an iron. U8 and U9 are SOT-23-6L with leads.

    LIFECYCLE TRAP: the first part found, SP3012-04HTG (0.5 pF typ, 0.65 pF
    max), is marked Obsolete by Littelfuse (replaced by SP3019-04HTG) and by
    DigiKey, while aggregator sites still list stock as 'active'. SP3019 is
    the Littelfuse replacement and is better on capacitance.

    U8 PIN MAP, PROVENANCE: [SP3019] (committed) page 1, pinout drawing and functional block diagram: I/O on pins 1, 3, 4, 6, GND on pin 2, pin 5 not connected; pin 1 is the dotted corner at the bottom left of the top view, the same numbering as KiCad's SOT-23-6 footprint (pads 1-3 along one side, 4-6 back along the other). Task 8 must still check the placed footprint's pad 1 against that drawing. LAYOUT (for tasks 8 and 9). U9 is flow-through: D+ enters pad 1 and leaves
    pad 6, D- enters 3 and leaves 4. U8 is NOT flow-through, each line has one
    pin: take each line through its pad (trace in and out of the same pad, no
    side stub), TX pair on pins 1 and 3 with GND (pin 2) between, RX pair on
    pins 6 and 4, pin 5 unconnected. Both at J3, U8 on the connector side of
    C22/C23, GND vias beside the GND pins to In1. Re-check the 90 ohm geometry
    at the pads.

    NOT YET CHECKED: the IEC 61000-4-2 ratings are datasheet figures; nothing
    here has been tested on the bench.
  mdi_unprotected: >
    DECIDED 2026-11-01 (task 6): the eight MDI lines (MDI0..3 P/N) carry NO
    ESD diodes. This is a decision, not an omission. J2 is a MagJack: its
    transformers isolate the cable pairs from the PHY (hipot 1500 Vrms,
    [LPJG]) and its integrated Bob Smith termination (4 x 75 ohm to a 1000
    pF/2 kV node on SHIELD) takes the common-mode energy of a strike. A diode
    array on the PHY side of the transformer would only add capacitance to 100
    ohm pairs at 125 MBd for a strike that the magnetics already block. The
    residual risk is the one every Ethernet PHY on a MagJack carries, and
    [OLIMEX] Rev E, the reference design, adds nothing there either (as read
    from its schematic; not re-checked in task 6).
  measurement_points: >
    ADDED 2026-11-01 (task 6) so that the current measurements deferred to the
    first build can be made. Seven bare test pads, no parts: TP1 GND, TP2 raw
    +5V, TP3 +5V_SW, TP4 +3V3, TP5 +1V0, TP6 AVDD33_LDO (U3 pin 20), TP7
    DVDD10_UPS (U3 pin 22). TP6 and TP7 exist because the first-build
    procedures for those two pins (U3 design_notes.ldo_outputs, C17) say to
    probe them. Two series links, JP1 in +3V3 (between U4/C6 and the load) and
    JP2 in +1V0 (between the buck and the load).

    WHY A SOLDER JUMPER AND NOT A 0R RESISTOR. JP1/JP2 are pre-bridged solder
    jumpers (KiCad footprint
    SolderJumper-2_P1.3mm_Bridged_RoundedPad1.0x1.5mm): a 0.5 x 0.6 mm copper
    bridge between two pads, closed as built, so the board works without
    anyone touching it. Cut the bridge with a knife (check with a meter that
    it is open), solder the ammeter leads to the two pads, read the current;
    close it again with a blob of solder. Bridge resistance: rho x L / (w x t)
    = 1.7e-8 x 0.3 mm / (0.6 mm x 35 um) = 0.24 mohm. A 0R chip resistor is
    specified in the tens of milliohm (not checked against the Yageo datasheet
    here); at the 1V0 design current of 0.51 A that could eat the 22 mV the
    buck leaves on the low side of the 0.95 V window (U6 output_voltage: 0.972
    V worst case). The net-tie property of the footprint stops KiCad reporting
    the bridge between two nets as a short. R5 and C24 sense +1V0_REG, the
    regulator side of JP2, so cutting JP2 does not open the feedback loop; C6
    and C4 stay on the regulator side so the regulators keep their output
    capacitors while the link is open. Opening a link removes the decoupling
    of the load behind it from the regulator: measure quickly and with the
    cable attached only briefly.
  bom_and_dnp: >
    ADDED 2026-11-01 (task 6). Two flags on a component, read by
    tools/fitting.py for both gen_bom.py and gen_schematic.py. `populate:
    false` = DNP: the position exists, nothing is fitted (R12, C24). The
    schematic marks it (dnp yes); bom.csv lists it with Populate = DNP,
    Quantity = 0, an EMPTY Part Number cell (a buyer working down that column
    cannot order it) and the part to use if it is ever fitted in 'Part If
    Fitted'; DNP rows come last. A value text that says DNP without `populate: false` is refused by both generators. The schematic symbol of a DNP part is also (in_bom no) and carries its part number only as `MPN_If_Fitted`, never `MPN`, so a BOM exported from KiCad itself cannot list R12 with an orderable number either. `bom: false` = a board feature that
    is not a part (TP1..TP7, JP1, JP2): on the schematic and the PCB, left out
    of the BOM.

    NOT DONE HERE, and a hand-off: tools/gen_pcb.py does not set KiCad's do-
    not-populate attribute on a footprint, and it was not to be touched in
    task 6. Whoever regenerates the PCB (task 8) must carry DNP and exclude-
    from-BOM onto the footprints of R12, C24 and the TP/JP parts, or a CPL
    exported from the PCB lists R12 as a part to place.

    PACKAGES (spec 5.1: everything except U3 must be hand-solderable; passives
    go 0402 -> 0603 where the layout allows, EXCEPT the crystal load
    capacitors and the decoupling at U3, which stay small and close for signal
    integrity). Task 6 first raised every 0402 and was corrected after review.
    0402 stays: C7, C9-C16, C18 (U3 decoupling), C17 (U3 DVDD10_UPS LDO output
    capacitor, 'as close as possible to the power pins', [RTL-DS] 6.15), C19,
    C20 (crystal load), C22, C23 (SuperSpeed AC coupling: a 0603 pad on a 90
    ohm pair is a larger discontinuity, it sits beside U8, and the pair must
    stay symmetric) and R14 (its pad adds to Cstray on the crystal node and
    the drive-level question there is already tight; a controller call, 5.1
    does not exempt it). 0603: C1, C2, C5, C6, C21, C24, C26, R5-R8, R11, R12
    (R12 and C24 are the parts the operator may have to fit by hand on the
    first build, which is why they are not 0402), C8. C8 IS A DELIBERATE
    DEVIATION FROM 5.1, recorded by the spec owner: C8 is decoupling at U3 and
    5.1 would keep it 0402, but a 2.2 uF ceramic in 0402 at 3.3 V bias loses a
    large fraction of its nominal value to DC bias and its job is LDO phase
    compensation, where actual capacitance outweighs ESL. Do not revert it to
    0402. Larger on purpose: C3, C4 0805 (a 10 uF/22 uF 0603 loses too much
    capacitance to DC bias), C25, R13 1206 (2 kV rating, direct-tie option),
    L2 3225. Every row has a manufacturer part number; the lifecycle check
    over all rows is in hardware/review/part-sourcing.md.
  shield_tie: >
    DECIDED 2026-11-01: 1nF/2kV (C25) in parallel with 1M (R13) from SHIELD to
    GND, not a direct tie. A direct tie was the alternative.
    Why: the SHIELD net is the cable-side shield, which at the far end of the
    Ethernet cable is normally bonded to the switch's chassis, while this
    board's GND is the Pi's USB-powered 5V return, which sits behind the PoE+
    HAT's isolated converter (OPEN_QUESTIONS.md item 0; that isolation is as
    stated there and has not been re-verified here). A direct tie would
    give a DC path from the cable shield into that GND, bypassing the isolation
    the HAT provides, and a ground loop through the Pi's own Ethernet cable.
    The 1nF/2kV cap still returns high-frequency common-mode energy and holds
    off the 1500Vrms of the jack's own hipot rating; the 1M bleed stops the
    shield from floating at some arbitrary DC level, which would make it an
    antenna. The jack's internal 1000pF/2kV from its Bob Smith node to SHIELD
    is unchanged by this. Precedent: [OLIMEX] Rev E ties the jack shield to
    GND through a single 1nF/2kV/X7R/1206 (C9); the 1M is added here.
    R13 is a 1206 pad so that fitting a 0R instead gives the direct tie, if EMC
    testing prefers it, without a respin. 1206 rather than 0402 for the higher
    working-voltage rating; how it behaves in a 1.5kV hipot test is not verified.
    J3's USB shield is tied to GND, which is the normal device-side convention.
  usb3_crossover: >
    VERIFIED AGAINST THE USB 3.0 SPECIFICATION 2026-11-01; THE WUERTH SHEET IS
    STILL PENDING a committed copy (see [WE-692] in the header).
    Primary citation, [USB3] section 5.3.1.2 Table 5-2, "USB 3.0 Standard-A
    Connector Pin Assignments": 5 StdA_SSRX-, 6 StdA_SSRX+, 7 GND_DRAIN,
    8 StdA_SSTX-, 9 StdA_SSTX+, with the table's own note "Tx and Rx are defined
    from the host perspective". J3 is an A-*plug* that mates with the host's
    A-receptacle, so the plug pin labelled SSTX is the host's transmitter and
    must feed our receiver, and the pin labelled SSRX is the host's receiver and
    must be fed by our transmitter. U3 side from [RTL-DS] table 10:
    U3SSTXP/N = 13/12 outputs, U3SSRXP/N = 16/15 inputs.
      U3 SSTX 13 (P) -> C22 -> J3 pin 6 (StdA_SSRX+)    P to P, N to N
      U3 SSTX 12 (N) -> C23 -> J3 pin 5 (StdA_SSRX-)
      U3 SSRX 16 (P) <- J3 pin 9 (StdA_SSTX+)
      U3 SSRX 15 (N) <- J3 pin 8 (StdA_SSTX-)
    This is what nets USB3_TX_* / USB3_RX_* wire. Net names follow the
    DEVICE's direction (USB3_TX_* = we transmit). Result: the crossover is
    correct as drawn; no change to pin assignment was needed.
    WHAT IS NOT YET CHECKED: that Wuerth's 692112030100 follows Table 5-2 pin
    for pin. The text of its datasheet as returned by a web search says it does
    (5 StdA_SSRX-, 6 StdA_SSRX+, 7 GND_DRAIN, 8 StdA_SSTX-, 9 StdA_SSTX+, Gender:
    Plug, Type A), and a plug has to, to mate; but that is search-extracted text
    with no hash. OPEN ITEM for a person: download the PDF, commit it, record
    the md5. Tracked into the Task 11 ordering instructions.
    ADDED WITH THIS CHECK: the netlist had no AC-coupling capacitors in the
    SuperSpeed transmit path. USB 3.0 requires 75-200 nF in series at the
    transmitter; [RTL-DS] does not mention it; [OLIMEX] Rev E has 100nF in each
    TX line. C22 (P) and C23 (N), 100nF 0402, are added at the transmitter.
    The receive pair needs none on our side (the host's TX is already coupled).
    The ESD parts planned for these pairs must go on the connector side of
    C22/C23, or between them and J3, not between U3 and the caps.
  led_polarity: >
    CHECKED 2026-11-01 against [RTL-DS]. The premise "the pins sink" turned
    out to be the wrong question: the datasheet does not make the pins sink or
    source, it makes the level programmable.
    * Table 26 (DC characteristics): Voh >= 0.9*VDD33 at Ioh = -4 mA and Vol <=
      0.1*VDD33 at Iol = 4 mA. These are push-pull outputs rated to source
      and to sink 4 mA.
    * 6.2 tables 12 and 15 (LED Feature Control-1): bits 14:12 of OCP register
      DD90h are the active level of LED2, LED1 and LED0 respectively, 0 =
      "LowActive", 1 = "HighActive"; bit 15 picks Option 1 or 2 of table 17.
      The level is therefore a register field, not a pin property.
    * 6.2 table 16: with no link and no activity the pin is "Floating"; table 7
      note 1: the output level depends on link state and the high/low-active
      setting; with the LAN disabled the pin is 0 V.
    What the datasheet does NOT give: the power-on default of those bits. So
    which polarity the part comes up in is NOT settled by the datasheet.
    Decision: keep the wiring (anode -> R -> +3V3, cathode -> LED pin). It works
    when the pin is LowActive (pin driven low = LED lit; pin floating = LED
    off). [OLIMEX] Rev E wires its yellow LED as a sink too: anode to +3.3V,
    cathode through R1 1K to the LED2 pin (resistor on the cathode side, which
    is electrically the same as the anode-side resistor used here). If U3 powers up HighActive the
    LED stays dark (the pin drives high into a cathode, reverse bias; no
    current, no damage) and the fix is the register bit, not the board,
    so the resistor-to-cathode-side swap is NOT needed. Current: 1k with VF
    1.8-2.6 V gives about 0.7-1.5 mA, well under the 4 mA the pin is rated for.
    NEEDS CONFIRMATION ON FIRST BUILD: link a cable and see whether the LEDs
    light for link; if inverted or dark, clear DD90h bits 14:12 (0 =
    LowActive).
    Other facts from the datasheet for the record: pins 24/30/32 default to LED
    mode (table 11), the LEDs may blink at power-on or during EEPROM/SPI access
    (5.11), and "LED OFF Mode" (all select bits 0) makes the pins float.
  mdi_pair_mapping: >
    J2 PHY-side pins carry to cable pins as: TD1 -> J1/J2, TD2 -> J3/J6,
    TD3 -> J4/J5, TD4 -> J7/J8 ([LPJG] sheet 1/2). That is the standard
    1000BASE-T assignment. AutoMDX in both the PHY and the jack means pair
    order and polarity are corrected automatically, so exact pair-to-pair
    assignment is not critical - but keep each pair routed as a pair.
  rail_currents: >
    REWRITTEN 2026-11-01 (task 6); the earlier note had no source. [RTL-DS]
    table 26, 'At 1000Mbps with heavy network traffic': Icc5 0.5 mA, Icc33 70
    mA, Icc10 170 mA, all TYPICAL; the datasheet gives no maximum. Note 3:
    Isys5 = Icc5 + Icc33 + Icc10 x 1.0 / efficiency / 5, efficiency 0.70.
    Typical total from the 5 V rail: 0.5 + 70 + 170/0.70/5 = 119 mA.

    DESIGN CURRENTS, an assumption and not a datasheet value: three times
    typical, because only typical values exist. +3V3: 3 x 70 mA = 210 mA, plus
    the two LEDs ((3.3 - 2.2 V) / 1 kohm = 1.1 mA each, VF about 2.2 V) = 212
    mA, call it 0.22 A. +1V0: 3 x 170 = 510 mA. +5V (J3): 3 x 119 = 357 mA.
    Compare: U4 600 mA (2.8x margin), U6 2 A and L2 3.3 A saturation (the 1 A
    design point of U6 design_notes.inductor stays valid, now about twice the
    conservative figure), U7 2 A, USB 3.0 900 mA after configuration.

    U4 DISSIPATION, the number to watch: (5.0 - 3.3 V) x 0.212 A = 0.36 W;
    [AP2112] thetaJA for SOT25 is 184 C/W, so 66 K of junction rise: Tj = 91 C
    at 25 C ambient, 125 C at 59 C ambient. At the typical 72 mA it is 0.12 W
    and 22 K. Fine on a bench, to be watched in a closed case; the alternative
    if it runs hot is feeding U3's 3.3 V loads from the buck rather than the
    LDO, which is a respin.

    TO CHECK ON THE FIRST BUILD (this is a guess until measured): cut JP1 and
    JP2 in turn and read the current at 1000 Mbit/s under iperf3, and the 5 V
    current at the host with a USB power meter. If the measured +3V3 current
    exceeds 0.22 A or the +1V0 current 0.51 A, this note is wrong, not the
    board.
