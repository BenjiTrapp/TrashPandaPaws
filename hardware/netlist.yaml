# Raccoon Tap v2 — authoritative netlist
#
# Architecture: Option A (see OPEN_QUESTIONS.md item 0). PoE is handled by the
# official Raspberry Pi PoE+ HAT; this board is only the USB 3.0 -> Gigabit
# Ethernet tap and draws its power from the USB port it plugs into.
#
# This file is the source of truth. tools/gen_schematic.py generates
# kicad/raccoon-hat.kicad_sch from it. Every pin number carries a provenance
# note; nothing here is inferred.
#
# Sources:
#   [RTL-DS]  RTL8153B-VB-CG datasheet rev 1.4, Track ID JATR-8275-15,
#             pin tables 5.1-5.11 and pin assignment figure p.4
#   [RTL-614] same, 6.14 Switching Regulator
#   [RTL-615] same, 6.15 LDO Regulator
#   [AP-DS]   AP2112 datasheet (Diodes Inc)
#   [GUIDE]   design-guide.md
#   [OLIMEX]  Olimex USB-GIGABIT Rev.E, OSHW UID BG000059, CERN OHL v1.2,
#             github.com/OLIMEX/USB-GIGABIT - connectivity traced from the
#             KiCad schematic, values from USB-GIGABIT_Rev_D_BOM.csv.
#             CAVEAT: Olimex use the RTL8153VC-CG (QFN-48, 6x6mm), not the
#             RTL8153B-VB (QFN-40, 5x5mm) used here. Pin numbers do NOT map.
#             Values are usable as an engineering reference only where the
#             function is variant-independent; each is annotated below.
#   [LPJG]    LINK-PP LPJG16402AQNL drawing LP11021122 rev A, sheets 1/2 and
#             2/2, read from the rendered drawing. UL file E484635.
#   [VERDICT] hardware/review/u3-pinout-verdict.md - the Task 3 gate result: every
#             U3 pin number and the roles of pins 20 and 22, taken from [RTL-DS].
#             Section numbers below ("Table 6", "6.15") are [RTL-DS] unless stated.
#   [ABM8]    Abracon ABM8 ceramic SMD crystal datasheet, revised 2020-07-29,
#             hardware/datasheets/ABM8_abracon_rev2020-07-29.pdf (md5 57e1ee1bde6f9bb895f0c55dde98b00b)
#   [WE-692]  Wuerth Elektronik 692112030100 datasheet (WR-COM USB 3.0 SMT Plug,
#             order code 692112030100, rev BBO 002.000, 2022-04-28), pin
#             assignment table. Read from https://www.we-online.com/components/
#             products/datasheet/692112030100.pdf as returned by a web search
#             tool; the PDF itself was refused to scripted download (HTTP 403),
#             so no copy is committed and no hash can be given.
#   [TBD]     not determinable from available documents - see OPEN_QUESTIONS.md

meta:
  board: Raccoon Tap
  revision: "2.1-draft"
  architecture: "Option A - USB-powered GbE tap, PoE via Pi PoE+ HAT"
  date: "2026-11-01"
  routed: false
  erc_clean: false

# ---------------------------------------------------------------------------
# Stackup
# ---------------------------------------------------------------------------
# Decision 2026-09-25: 4 layers. Two independent reasons:
#   1. USB 3.0 SuperSpeed at 5 Gbit/s needs a controlled-impedance reference
#      plane directly under the signal layer. This is not optional.
#   2. It makes the buck and the MDI pairs far more forgiving, which is the
#      stated goal: lowest risk, robust layout.
stackup:
  layers: 4
  thickness: "1.6 mm"
  copper: "1 oz outer, 1 oz inner (0.5 oz inner is acceptable if the fab prefers)"
  assignment:
    F_Cu: "signals - USB 3.0 pairs, MDI pairs, and the buck's hot loop"
    In1_Cu: "solid GND plane - unbroken reference under every high-speed pair"
    In2_Cu: "power - +5V, +3V3, +1V0 pours"
    B_Cu: "signals and a second GND pour"
  impedance:
    usb3_superspeed: "90 ohm differential, +/-10%, referenced to In1 GND"
    usb2_dp_dm: "90 ohm differential"
    mdi_pairs: "100 ohm differential, referenced to In1 GND"
    note: >
      Ask the fab for a stackup that hits these targets at their actual core
      and prepreg thicknesses. Do not assume a trace geometry - JLCPCB, PCBWay
      and Aisler all publish impedance calculators for their 4-layer stacks.
  rules:
    - "Never break the In1 GND plane under a differential pair."
    - "Length-match within a pair: USB 3.0 <=2 mm, MDI <=5 mm. [GUIDE] 4."
    - "Keep the buck hot loop (U6 IN -> LX -> L2 -> COUT -> GND) small and on F_Cu."
    - "Keep the R5/R6 divider and its FB trace away from the LX switch node. [SY8089]"
    - "U3 exposed pad (pin 41) is GND: stitch to In1 with a via array."
    - >
      J2 is the isolation barrier. Keep the cable-side SHIELD pour separate from
      signal GND, joined only at the intended single point. The jack's internal
      1000pF/2kV already bridges the BST node to SHIELD.

# ---------------------------------------------------------------------------
# Power rails
# ---------------------------------------------------------------------------
rails:
  "+5V":
    source: "J3 USB VBUS"
    range: "4.5 - 5.5 V"
    note: "[RTL-DS] table 21: VDD5 min 4.5 typ 5.0 max 5.5"
  "+3V3":
    source: "U4 AP2112K-3.3 output"
    range: "3.14 - 3.46 V"
    note: "[RTL-DS] table 21: DVDD33/AVDD33"
  "+1V0":
    source: "U6 SY8089AAAC external buck (ENSWREG tied low, internal SWR disabled)"
    range: "0.95 - 1.05 V"
    note: >
      [RTL-DS] table 21 gives the 0.95-1.05 V window for DVDD10, AVDD10,
      U3VDD10, U2VDD10 (and DVDD10_UPS, which is NOT fed from this rail: it is
      an LDO output, see U3 design_notes.ldo_outputs). Connection rule for this
      rail: [RTL-DS] 6.14 - REGOUT's 1.0 V output "must be connected only to
      DVDD10, AVDD10, U3VDD10, and U2VDD10"; this rail takes REGOUT's place, so
      the same four pin groups, and only those, hang on it.
      Decision 2026-09-25: external buck rather than the chip's internal
      switching regulator, on a 4-layer board. Rationale in OPEN_QUESTIONS.md
      item 3f - [RTL-614] warns the internal SWR "requires a well-designed PCB
      layout in order to achieve good power efficiency and lower the output
      voltage ripple and input overshoot", and an external buck removes that
      risk entirely. Consequence: ENSWREG (25) -> GND, and REGOUT (28) is left
      unconnected.
  GND:
    source: "J3 USB GND, U3 pin 29 and exposed pad 41"

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:

  U3:
    value: RTL8153B
    mpn: RTL8153B-VB-CG
    package: QFN-40, 5x5mm, exposed pad
    footprint: "Package_DFN_QFN:QFN-40-1EP_5x5mm_P0.4mm_EP3.6x3.6mm"
    description: USB 3.0 to Gigabit Ethernet controller
    source: >
      [RTL-DS] - 40 pins + exposed pad = pin 41. All 41 pin numbers confirmed
      against [RTL-DS] tables 1-10 and figure 1 in three copies of the PDF,
      see [VERDICT] sec. 3; re-run with
      `python3 hardware/datasheets/crosscheck_u3_pinout.py`.
    pins:
      1:  {name: MDIP0,      type: bidirectional}
      2:  {name: MDIN0,      type: bidirectional}
      3:  {name: AVDD10,     type: power_in}
      4:  {name: MDIP1,      type: bidirectional}
      5:  {name: MDIN1,      type: bidirectional}
      6:  {name: MDIP2,      type: bidirectional}
      7:  {name: MDIN2,      type: bidirectional}
      8:  {name: AVDD10,     type: power_in}
      9:  {name: MDIP3,      type: bidirectional}
      10: {name: MDIN3,      type: bidirectional}
      11: {name: AVDD33,     type: power_in}
      12: {name: U3SSTXN,    type: output}
      13: {name: U3SSTXP,    type: output}
      14: {name: U3VDD10,    type: power_in}
      15: {name: U3SSRXN,    type: input}
      16: {name: U3SSRXP,    type: input}
      17: {name: U2DM,       type: bidirectional}
      18: {name: U2DP,       type: bidirectional}
      19: {name: U2VDD10,    type: power_in}
      20: {name: AVDD33,     type: power_out, note: "LDO 3.3V OUTPUT, not a supply input: [RTL-DS] table 6 'AVDD33 P 20 Linear Regulator (LDO) 3.3V Output... designed for RTL8153B-VB internal use only'. Own output cap, NOT on +3V3. See design_notes.ldo_outputs."}
      21: {name: VDD5,       type: power_in}
      22: {name: DVDD10_UPS, type: power_out, note: "LDO 1.0V OUTPUT, not a supply input: [RTL-DS] table 6 'DVDD10_UPS P 22 Linear Regulator (LDO) 1.0V Output', 6.15 notes 1 and 2. Own output cap, NOT on +1V0. See design_notes.ldo_outputs."}
      23: {name: DVDD33,     type: power_in}
      24: {name: LED2,       type: output,   shared: "EEDO/LED2/SPISDO/LANWAKEB/GPIO"}
      25: {name: ENSWREG,    type: input,    shared: "EEDI/SPISDI/ENSWREG"}
      26: {name: VDDREG33,   type: power_in}
      27: {name: VDDREG5,    type: power_in}
      28: {name: REGOUT,     type: power_out}
      29: {name: GND,        type: power_in}
      30: {name: LED1,       type: output,   shared: "EESK/LED1/SPISCK"}
      31: {name: EECS,       type: output}
      32: {name: LED0,       type: output,   shared: "LED0/SPICSB"}
      33: {name: DVDD33,     type: power_in}
      34: {name: DVDD10,     type: power_in}
      35: {name: CKXTAL1,    type: input}
      36: {name: CKXTAL2,    type: bidirectional}
      37: {name: AVDD10,     type: power_in}
      38: {name: RSET,       type: input}
      39: {name: AVDD33,     type: power_in}
      40: {name: AVDD33,     type: power_in}
      41: {name: GND,        type: power_in, note: "exposed pad"}
    design_notes:
      rset: >
        RSET (38) takes a precision resistor to GND. [OLIMEX] traced:
        U3.RSET -> R8.1, R8.2 -> GND, R8 = 2.49k 1% 0402. The pin sets an
        internal current reference, which is a variant-independent function,
        so 2.49k 1% is a sound starting value - but it comes from the VC
        variant and is not stated in the VB datasheet. Verify on first build.
      enswreg: >
        ENSWREG (25, shared with SPISDI) is a power-on latch: 3.3V enables the
        internal switching regulator, 0V disables it and requires external 1.0V.
        [OLIMEX] tie it to GND and feed the low-voltage rail from an external
        SY8089 buck + 2.2uH inductor, with a 1:1 divider (R12=R15=1.1k 1%).
        DO NOT copy that divider: the SY8008 family reference is 0.6V, so a 1:1
        divider gives 1.2V, whereas [RTL-DS] table 21 specifies 0.95-1.05V for
        this variant's AVDD10/DVDD10/U3VDD10/U2VDD10. Decision open - see
        OPEN_QUESTIONS.md item 3f.
      lowv_rail_fanout: >
        CORRECTED 2026-11-01 (an earlier revision also listed DVDD10_UPS (22);
        that was wrong, see ldo_outputs). Whichever source is used, the 1.0V
        rail reaches AVDD10 (3, 8, 37), DVDD10 (34), U3VDD10 (14) and
        U2VDD10 (19), and nothing else. Source: [RTL-DS] 6.14 "REGOUT ... must
        be connected only to DVDD10, AVDD10, U3VDD10, and U2VDD10 (do not
        provide this power source to other devices)"; table 8 for the pin
        numbers (AVDD10 3/8/37, DVDD10 34, U3VDD10 14, U2VDD10 19). The earlier
        text traced to [OLIMEX], which is the RTL8153VC-CG, a different part.
        The rail has C12-C16 (five 100nF) plus C4 (22uF) at the buck; the
        Olimex count of 9 caps is for their variant and is not copied.
      ldo_outputs: >
        DECIDED 2026-11-01. Two pins of U3 are outputs of its embedded linear
        regulators, not supply inputs, and neither is connected to a supply
        rail of this board.
        (1) DVDD10_UPS (22): [RTL-DS] table 6 "Linear Regulator (LDO) 1.0V
        Output. Note: The embedded LDO is designed for RTL8153B-VB internal use
        only. Do not provide this power source to other devices."; 6.15 note 1
        (same), note 2 "The digital LDO output pin (DVDD10_UPS) should be
        separated from the other 1.0V SWR output pin (REGOUT)"; 6.14 lists the
        pins REGOUT may feed and 22 is not among them; 6.15 asks for "only an
        output capacitor between its output and analog ground for phase
        compensation", placed "as close as possible to the power pins". This
        design drives the +1V0 rail from U6 instead of REGOUT, and that rail
        takes REGOUT's place, so pin 22 is likewise kept off it. Pin 22 now has
        its own net (DVDD10_UPS) with C17 to GND as the output capacitor.
        C17 VALUE: the datasheet gives no capacitance. 100nF is kept because
        [OLIMEX] Rev E fit exactly 100nF/X5R/0402 (C22) on DVDD10_UPS, on its
        own net, off the 1.0V rail, with REGOUT left open as here. That is a
        different die and package (VC, QFN-48), so it is a precedent for the
        function, not a datasheet value. NEEDS CONFIRMATION ON FIRST BUILD:
        probe pin 22 for ~1.0V with a quiet waveform. The footprint is 0402, so
        a 1uF X5R drop-in is possible if it rings; no respin.
        (2) AVDD33 (20): [RTL-DS] table 6 "AVDD33 P 20 Linear Regulator (LDO)
        3.3V Output" with the identical internal-use-only note; 6.15 note 1
        covers "the embedded LDO". Table 8 lists pin 20 inside the AVDD33
        supply group (11, 20, 39, 40) and table 21 lists "DVDD33, AVDD33" by
        name, not by pin. DECISION: treat pin 20 as an LDO output, not on
        +3V3. REASONS: (a) table 6 is the only row that describes pin 20 on its
        own, and it says output; tables 8 and 21 only group it by name. (b) The
        same document has the identical pattern for pin 22 - table 8 calls it a
        "Digital 1.0V Uninterruptible Power Supply" and table 21 lists
        DVDD10_UPS as a supply voltage - yet 6.15 note 2 settles pin 22 as an
        output. So tables 8 and 21 demonstrably do not distinguish an LDO
        output from an input, and are not evidence against table 6. (c) Neither
        reading is directly contradicted by a rule, so the evidence leans, it
        does not prove: unlike pin 22 there is no 6.14/6.15 sentence naming pin
        20 and saying what it may touch. (d) Failure asymmetry, chosen to fail
        loudly and harmlessly: with pin 20 isolated, if it really were an
        input the chip fails to come up on first power, which is visible and
        fixed in two minutes by fitting R12 (0R, DNP, to +3V3). With pin 20 on
        +3V3, if it is an output, two regulators fight on the analog 3.3V rail
        and the fault may stay silent (heat, noise) in the field.
        [OLIMEX] COUNTER-EVIDENCE, stated so it is not lost: on Olimex Rev E
        (VC variant) the AVDD33 pin sitting next to VDD5 (their pin 25, the
        analogue of our 20 by position, not by datasheet) is tied to the common
        external 3.3V. Their datasheet was not available to check whether that
        pin is an LDO output there, so this does not settle the question.
        A web-search snippet of a paywalled reference-schematic overview ("Place
        C10 close to VDD33 pin 20 (reserved)") hints at a cap of its own on pin
        20. It was seen only as a snippet and is not relied on.
        PIN 20 CAP: C8, 2.2uF X5R 10V 0402. The datasheet gives no value; an
        LDO output capacitor "for phase compensation" is typically 1-10uF
        ceramic, 2.2uF is the middle, and DC bias at 3.3V leaves roughly 1uF
        effective in 0402, still inside that range. NEEDS CONFIRMATION ON FIRST
        BUILD. FIRST-BUILD TEST THAT SETTLES IT: with R12 not fitted, measure
        pin 20 against GND at power-up. About 3.3V means it is an LDO output
        and R12 must stay empty. 0V means it is an input after all: fit R12.
      decoupling_reference: >
        [OLIMEX] total 18x 100nF 0402 plus 2x 2.2uF 0603 across all rails.
        The repo currently has far fewer. Count and placement to be settled
        during layout, not here.

  U4:
    value: AP2112K-3.3
    mpn: AP2112K-3.3TRG1
    package: SOT-23-5
    footprint: "Package_TO_SOT_SMD:SOT-23-5"
    description: 3.3V 600mA LDO
    source: "[AP-DS]. Required - see OPEN_QUESTIONS.md 3d"
    pins:
      1: {name: VIN,  type: power_in}
      2: {name: GND,  type: power_in}
      3: {name: EN,   type: input}
      4: {name: NC,   type: no_connect}
      5: {name: VOUT, type: power_out}

  Y1:
    value: 25MHz
    mpn: ABM8-25.000MHZ-D2Y-T
    manufacturer: Abracon
    package: "3225"
    footprint: "Crystal:Crystal_SMD_3225-4Pin_3.2x2.5mm"
    description: "25MHz crystal for U3 clock reference, CL 18pF, +/-30ppm over temperature"
    source: >
      [RTL-DS] 7.4 table 23 and 'Supports 25MHz Crystal'. Part chosen against
      table 23, checked item by item against [ABM8]:
        Fref 25 MHz fundamental, AT-cut ...... ABM8 fundamental 8-54 MHz       OK
        Stability +/-30 ppm, 0..70 C ......... option code Y = +/-30 ppm, and
                                               code D = -40..+85 C, a superset OK
        Tolerance +/-50 ppm at 25 C .......... code 2 = +/-20 ppm              OK
        CL 16-20 pF .......................... standard CL 18.0 pF             OK
        ESR max 70 ohm; 50 ohm at C0 = 3 pF
        (table 23 note 3) .................... ABM8 table 1: 50 ohm max for
                                               20.000-29.999 MHz fundamental,
                                               C0 3.0 pF                       OK, at the limit
      Not met on paper: table 23 gives "DL Drive Level ... max 0.3 mW" and
      [ABM8] rates 100 uW max. Whether table 23 means the crystal must tolerate
      0.3 mW or that U3 drives no more than 0.3 mW is not stated; every 3225
      25 MHz part found is rated 100 uW. OPEN, NEEDS CONFIRMATION ON FIRST BUILD:
      measure the drive level (or at least check the oscillation amplitude at
      CKXTAL2) against the crystal's 100 uW rating.
      Variant-code decode (D2Y) is read from the ordering-option table of
      [ABM8]; distributor listings disagree on whether the D2Y tolerance is
      +/-20 or +/-50 ppm. Either satisfies table 23, but confirm on the order
      confirmation that the stability is +/-30 ppm.
      Footprint: pads 1 and 3 are the crystal terminals, pads 2 and 4 are GND
      ([ABM8] outline, top view). [ABM8] land pattern is a 2.3 x 1.75 mm pitch;
      the KiCad 3225-4Pin footprint is 2.2 x 1.6 mm - 0.1 mm off, within what
      the 1.3 x 1.05 mm pads absorb. An earlier revision of this file said
      package "3215", which is a 3.2 x 1.5 mm part; corrected.
    design_notes:
      load_caps: >
        CALCULATED 2026-11-01, replaces the 39pF placeholder.
        Series combination of the two caps plus stray capacitance must equal the
        crystal's CL: CL = C19*C20/(C19+C20) + Cstray; with C19 = C20 = C that
        is CL = C/2 + Cstray, so C = 2*(CL - Cstray).
        CL = 18 pF ([ABM8] standard). Cstray = 4 pF assumed (two 0402 pads, a
        short trace, U3's CKXTAL pins and the crystal's own pad capacitance;
        3-5 pF is the usual range, this is an assumption, not a measured value).
        C = 2*(18 - 4) = 28 pF -> nearest E24 value 27 pF.
        27 pF is also exactly what [RTL-DS] 7.4 table 23 notes 3 and 4 give:
        "the latest reference schematic recommends two external capacitors of
        27pF ... To match this use the load capacitance specified by the crystal
        manufacturer of 16~20pF." With 27 pF: CL = 13.5 + 4 = 17.5 pF; across
        Cstray 3-5 pF, CL = 16.5-18.5 pF, inside the 16-20 pF window of table 23.
        The earlier placeholder, 39 pF from [OLIMEX], would give CL = 19.5 + 4 =
        23.5 pF here: outside the 16-20 pF window, so the crystal would run low
        in frequency.
        Use C0G (NP0) 50V 0402, 5% or better, for stability.
    pins:
      # SMD3225/4 standard numbering: 1 and 3 are the crystal terminals,
      # 2 and 4 are the case ground pads. An earlier revision had 1/2 as the
      # two terminals, which would have grounded one electrode and left the
      # other floating. Caught when pcbnew reported pads 3 and 4 with no net.
      # Confirmed against [ABM8] outline drawing, top view: GND on pads 2 and 4.
      1: {name: XIN,   type: passive}
      2: {name: CASE1, type: passive, note: "case ground"}
      3: {name: XOUT,  type: passive}
      4: {name: CASE2, type: passive, note: "case ground"}

  J3:
    value: USB3-A-Plug
    mpn: "692112030100"
    manufacturer: Wuerth Elektronik
    package: "SMT horizontal"
    footprint: "Connector_USB:USB3_A_Plug_Wuerth_692112030100_Horizontal"
    description: >
      USB 3.0 Type-A plug to the Pi's blue USB 3.0 port. Supplies board power.
      Chosen over USB-C: the Pi 4's USB-C port is USB 2.0 OTG only (~320 Mbit/s
      measured by Olimex with this same PHY), and a USB-C receptacle would need
      a SuperSpeed mux to handle both plug orientations. See OPEN_QUESTIONS.md.
    source: >
      Standard USB 3.0 Type-A pinout, matched against the KiCad-maintained
      footprint for Wuerth 692112030100 (pads 1-9 plus SH shield).
    pins:
      # A connector passes signals through; it neither sources nor sinks them.
      # Everything is passive except VBUS, which really is a power source.
      # Declaring directions here caused 7 ERC errors (output-to-output and
      # undriven-input) on the first run - see OPEN_QUESTIONS.md ERC section.
      1: {name: VBUS,      type: power_out}
      2: {name: D_N,       type: passive}
      3: {name: D_P,       type: passive}
      4: {name: GND,       type: passive}
      # Names and numbers verified against [WE-692] "Pin Assignment": 5 StdA_SSRX-,
      # 6 StdA_SSRX+, 7 GND_DRAIN, 8 StdA_SSTX-, 9 StdA_SSTX+. See design_notes.usb3_crossover.
      5: {name: SSRX_N,    type: passive, note: "[WE-692] StdA_SSRX-; host-side name, host receives, we drive this"}
      6: {name: SSRX_P,    type: passive, note: "[WE-692] StdA_SSRX+; host-side name, host receives, we drive this"}
      7: {name: GND_DRAIN, type: passive}
      8: {name: SSTX_N,    type: passive, note: "[WE-692] StdA_SSTX-; host-side name, host transmits, we receive this"}
      9: {name: SSTX_P,    type: passive, note: "[WE-692] StdA_SSTX+; host-side name, host transmits, we receive this"}
      SH: {name: SHIELD,  type: passive, note: "shield tabs, footprint pad name SH"}

  U6:
    value: SY8089AAAC
    mpn: SY8089AAAC
    manufacturer: Silergy
    package: SOT-23-5
    footprint: "Package_TO_SOT_SMD:SOT-23-5"
    description: "1.0V buck converter for the RTL8153B core rails"
    source: >
      [SY8089] Silergy SY8089/SY8089A datasheet + AN_SY8089. 2.7-5.5V in,
      2A continuous / 3A peak, 1MHz fixed switching frequency.
      Vout = 0.6 x (1 + R1/R2), VREF = 0.588 / 0.600 / 0.612 V.
      Same part Olimex use for this role in their OSHW USB-GIGABIT.
    pins:
      1: {name: LX,  type: output,    note: "switch node -> L2"}
      2: {name: GND, type: power_in}
      3: {name: FB,  type: input,     note: "divider midpoint R5/R6"}
      4: {name: IN,  type: power_in}
      5: {name: EN,  type: input,     note: "tie to IN for always-on"}
    design_notes:
      output_voltage: >
        Target 1.000 V. R5 = 10.0k 1% (top, LX side), R6 = 15.0k 1% (bottom,
        to GND): Vout = 0.6 x (1 + 10.0/15.0) = 1.000 V.
        Worst case over VREF tolerance and 1% resistors: 0.972 - 1.028 V,
        inside the 0.95 - 1.05 V window of [RTL-DS] table 21.
        The datasheet recommends 10k...1M for both resistors, so 10k/15k is in
        range.
      do_not_copy_olimex: >
        Olimex use R12 = R15 = 1.1k, a 1:1 ratio, which gives 0.6 x 2 = 1.200 V.
        That suits their RTL8153VC but would over-volt a -VB core rail by 20%.
      inductor: >
        Datasheet formula L = Vout x (1 - Vout/Vin,max) / (Fsw x Iout,max x 40%).
        With Vout = 1.0 V, Vin,max = 5.5 V, Fsw = 1 MHz and a 1 A design point:
        L = 2.05 uH -> 2.2 uH standard value. Independently, this is the value
        Olimex ship. The IC does 2 A continuous, so >=2x headroom.
        The 1.0 V rail current is not specified in [RTL-DS]; 1 A is a
        conservative design point for a GbE PHY core and should be confirmed by
        measurement on the first build.
      feed_forward: >
        A DNP pad, C24, is provided across R5 (output to FB) for a feed-forward
        capacitor. No value is given because none is sourced: this file records
        no [SY8089] figure for it and the SY8089 datasheet is not in
        hardware/datasheets to check, and a number picked now would be a guess
        that looks like a spec. It costs one empty 0402 pad and allows trimming
        transient response or output ripple on the first build with a scope
        rather than a respin. Leave empty until a measurement says otherwise.
      layout: >
        Datasheet: keep CIN, L, R1 and R2 close to the IC, and keep the trace
        from the divider to FB short and away from the switch node.

  L2:
    value: 2.2uH
    package: "1210 or similar shielded"
    footprint: "Inductor_SMD:L_1210_3225Metric"
    description: "Buck output inductor for the 1.0V rail"
    source: "[SY8089] inductor equation, 1 A design point - see U6 design_notes"
    pins:
      1: {name: A, type: passive}
      2: {name: B, type: passive}

  R5:
    value: 10.0K
    tolerance: "1%"
    package: "0402"
    footprint: "Resistor_SMD:R_0402_1005Metric"
    description: "Buck feedback divider, top (LX/output side)"
    source: "[SY8089] Vout = 0.6 x (1 + R5/R6) -> 1.000 V"
    pins:
      1: {name: A, type: passive}
      2: {name: B, type: passive}

  R6:
    value: 15.0K
    tolerance: "1%"
    package: "0402"
    footprint: "Resistor_SMD:R_0402_1005Metric"
    description: "Buck feedback divider, bottom (to GND)"
    source: "[SY8089] Vout = 0.6 x (1 + R5/R6) -> 1.000 V"
    pins:
      1: {name: A, type: passive}
      2: {name: B, type: passive}

  R11:
    value: 2.49K
    tolerance: "1%"
    package: "0402"
    footprint: "Resistor_SMD:R_0402_1005Metric"
    description: "RSET current reference for U3, to GND"
    source: >
      [OLIMEX] traced: U3.RSET -> R8.1, R8.2 -> GND, R8 = 2.49k 1%.
      Not stated in [RTL-DS]; verify on first build. See OPEN_QUESTIONS.md 3e.
    pins:
      1: {name: A, type: passive}
      2: {name: B, type: passive}

  R7:
    value: 1K
    package: "0402"
    footprint: "Resistor_SMD:R_0402_1005Metric"
    description: "Series resistor, J2 yellow LED"
    source: "[OLIMEX] use 1K for the same role (~1mA). See J2 design_notes.leds"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}

  R8:
    value: 1K
    package: "0402"
    footprint: "Resistor_SMD:R_0402_1005Metric"
    description: "Series resistor, J2 green LED"
    source: "[OLIMEX]"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}

  # --- Bulk and rail capacitors ---
  C1:
    value: 10uF
    package: "0805"
    footprint: "Capacitor_SMD:C_0805_2012Metric"
    description: "USB VBUS bulk"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C2:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "USB VBUS HF decoupling"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C3:
    value: 10uF
    package: "0805"
    footprint: "Capacitor_SMD:C_0805_2012Metric"
    description: "U6 buck input (CIN)"
    source: "[SY8089] keep close to the IC"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C4:
    value: 22uF
    package: "0805"
    footprint: "Capacitor_SMD:C_0805_2012Metric"
    description: "U6 buck output (COUT) on +1V0"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C5:
    value: 1uF
    package: "0603"
    footprint: "Capacitor_SMD:C_0603_1608Metric"
    description: "U4 LDO input"
    source: "[AP-DS] AP2112 needs >=1uF on the input"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C6:
    value: 10uF
    package: "0603"
    footprint: "Capacitor_SMD:C_0603_1608Metric"
    description: "U4 LDO output on +3V3"
    source: >
      [AP-DS] needs >=1uF for loop stability. design-guide.md once said 100nF
      here, which would risk instability - see OPEN_QUESTIONS.md value table.
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}

  # --- Decoupling, one per supply pin group ---
  C7:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "+3V3 decoupling at U3 AVDD33 (11)"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C8:
    value: 2.2uF
    tolerance: "X5R, 10V"
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "Output capacitor of U3's embedded 3.3V LDO at AVDD33 (20); NOT on +3V3"
    source: >
      [RTL-DS] 6.15: "only an output capacitor between its output and analog
      ground for phase compensation". No value given; 2.2uF chosen, NEEDS
      CONFIRMATION ON FIRST BUILD. Reasoning in U3 design_notes.ldo_outputs.
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C9:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "+3V3 decoupling at U3 AVDD33 (39, 40)"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C10:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "+3V3 decoupling at U3 DVDD33 (23)"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C11:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "+3V3 decoupling at U3 DVDD33 (33) and VDDREG33 (26)"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C12:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "+1V0 decoupling at U3 AVDD10 (3)"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C13:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "+1V0 decoupling at U3 AVDD10 (8)"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C14:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "+1V0 decoupling at U3 AVDD10 (37)"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C15:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "+1V0 decoupling at U3 DVDD10 (34)"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C16:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "+1V0 decoupling at U3 U3VDD10 (14) and U2VDD10 (19)"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C17:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "Output capacitor of U3's embedded 1.0V LDO at DVDD10_UPS (22); NOT on +1V0"
    source: >
      [RTL-DS] 6.15: "only an output capacitor between its output and analog
      ground for phase compensation"; no value given. 100nF as fitted by
      [OLIMEX] Rev E C22 on its DVDD10_UPS (variant VC). NEEDS CONFIRMATION ON
      FIRST BUILD, 1uF X5R is the drop-in if needed. See U3 design_notes.ldo_outputs.
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C18:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "+5V decoupling at U3 VDD5 (21) and VDDREG5 (27)"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}

  # --- Crystal load caps ---
  C19:
    value: 27pF
    tolerance: "C0G"
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "Y1 load capacitor, CKXTAL1 side"
    source: >
      Computed from Y1 = ABM8-25.000MHZ-D2Y-T, CL 18 pF [ABM8]:
      C = 2*(CL - Cstray) = 2*(18 - 4) = 28 pF -> 27 pF. Matches the 27 pF of
      [RTL-DS] 7.4 table 23 note 4. Calculation in Y1 design_notes.load_caps.
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C20:
    value: 27pF
    tolerance: "C0G"
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "Y1 load capacitor, CKXTAL2 side"
    source: "Same as C19 - see C19 and Y1 design_notes.load_caps"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}

  # --- MagJack PHY-side centre tap ---
  C21:
    value: 100nF
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "Bypass for J2 PHY-side centre taps (pins 5, 6) to GND"
    source: "[LPJG] sheet 1/2 - pins 5/6 are the PHY-side centre-tap common"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}

  # --- Added 2026-11-01 (Task 5). Generators do not yet understand DNP: the
  # --- value text carries it so it reaches the BOM. Parts are unplaced in
  # --- gen_pcb.py PLACEMENT until the placement task.
  C22:
    value: 100nF
    tolerance: "X7R/X5R, 10V"
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "USB 3.0 SuperSpeed TX AC-coupling, U3SSTXP (13) to J3 pin 6"
    source: >
      USB 3.0 requires the transmitter to be AC coupled with 75-200 nF in
      series, placed at the transmitter. [RTL-DS] is silent on it. [OLIMEX]
      Rev E fit 100nF/X5R/0402 in series in each of U3TX_P and U3TX_N (C1, C2).
      NOT in the earlier netlist; found while verifying usb3_crossover. Place
      close to U3, symmetric with C23, same size and orientation.
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  C23:
    value: 100nF
    tolerance: "X7R/X5R, 10V"
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "USB 3.0 SuperSpeed TX AC-coupling, U3SSTXN (12) to J3 pin 5"
    source: "Same as C22"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}

  R12:
    value: "0R DNP"
    populate: false
    package: "0402"
    footprint: "Resistor_SMD:R_0402_1005Metric"
    description: "DNP link between U3 pin 20 (AVDD33 LDO output) and +3V3; fit only if pin 20 proves to be a supply input"
    source: >
      Contingency for the pin 20 decision, see U3 design_notes.ldo_outputs.
      Leave EMPTY unless the first-build measurement shows pin 20 at 0 V.
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}

  C24:
    value: DNP
    populate: false
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    description: "DNP feed-forward capacitor across the buck feedback divider top resistor R5"
    source: >
      Pad only, no value. See U6 design_notes.feed_forward. Wired across R5:
      one side on +1V0 (output), the other on FB.
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}

  C25:
    value: 1nF
    tolerance: "X7R, 2kV, 10%"
    package: "1206"
    footprint: "Capacitor_SMD:C_1206_3216Metric"
    description: "J2 SHIELD to GND, high-frequency return"
    source: "[OLIMEX] Rev E C9, 1nF/2000V/10%/X7R/1206 from the jack shield to GND. See design_notes.shield_tie."
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}
  R13:
    value: 1M
    tolerance: "5%"
    package: "1206"
    footprint: "Resistor_SMD:R_1206_3216Metric"
    description: "J2 SHIELD to GND, DC bleed in parallel with C25; the pad also takes a 0R for a direct tie"
    source: "design_notes.shield_tie (the 1M bleed is the usual companion of the 1nF; not in [OLIMEX])"
    pins: {1: {name: A, type: passive}, 2: {name: B, type: passive}}

  J2:
    value: LPJG16402AQNL
    mpn: LPJG16402AQNL
    manufacturer: LINK-PP
    package: "THT, right-angle, tab-up, 21.25 x 15.95 x 13.45 mm"
    footprint: "raccoon:RJ45_LPJG16402AQNL"
    description: >
      1000BASE-T RJ45 MagJack with integrated magnetics, integrated Bob Smith
      termination and bi-colour LEDs. Replaces the HR911105A, which was a
      10/100-only part - see OPEN_QUESTIONS.md item 4.
    source: >
      [LPJG] LINK-PP drawing LP11021122 rev A, sheets 1/2 (schematic) and 2/2
      (mechanical). Title "RJ45 Connector With 1000 Base-TX Integrated Magnetic".
      UL file E484635.
    specs:
      turns_ratio: "1CT:1CT +/-2%"
      ocl: "350uH min @ 100kHz, 0.1Vrms, 8mA DC"
      insertion_loss: "-1.0dB max, 0.9-100MHz"
      crosstalk: "-25dB min, 1-100MHz"
      common_mode_rejection: "-30dB min, 1-100MHz"
      hipot: "1500Vrms min - satisfies IEEE 802.3 isolation"
      temperature: "-40 to +85 C"
      bob_smith: >
        INTEGRATED: 4x 75R from the cable-side centre taps to a common node,
        then 1000pF/2kV to SHIELD. No external termination parts are needed.
      automdx: "yes - pair swap and polarity handled by the PHY"
      poe: "NO - data only. Fine here, since PoE is handled by the Pi PoE+ HAT."
    pins:
      1:  {name: TD1_P,  type: passive, note: "PHY side, pair 1 -> cable J1 (TX1+)"}
      2:  {name: TD1_N,  type: passive, note: "PHY side, pair 1 -> cable J2 (TX1-)"}
      3:  {name: TD2_P,  type: passive, note: "PHY side, pair 2 -> cable J3 (TX2+)"}
      4:  {name: TD2_N,  type: passive, note: "PHY side, pair 2 -> cable J6 (TX2-)"}
      5:  {name: CT_A,   type: passive, note: "PHY-side centre-tap common"}
      6:  {name: CT_B,   type: passive, note: "PHY-side centre-tap common"}
      7:  {name: TD3_P,  type: passive, note: "PHY side, pair 3 -> cable J4 (TX3+)"}
      8:  {name: TD3_N,  type: passive, note: "PHY side, pair 3 -> cable J5 (TX3-)"}
      9:  {name: TD4_P,  type: passive, note: "PHY side, pair 4 -> cable J7 (TX4+)"}
      10: {name: TD4_N,  type: passive, note: "PHY side, pair 4 -> cable J8 (TX4-)"}
      11: {name: LED_R_A, type: passive, note: "right LED, bi-colour: 11+/12- green, 11-/12+ orange"}
      12: {name: LED_R_B, type: passive, note: "right LED, bi-colour"}
      13: {name: LED_L_A, type: passive, note: "left LED anode, yellow"}
      14: {name: LED_L_K, type: passive, note: "left LED cathode, yellow"}
      SH1: {name: SHIELD1, type: passive, note: "shield tab, footprint pad SH1"}
      SH2: {name: SHIELD2, type: passive, note: "shield tab, footprint pad SH2"}
    mechanical:
      signal_pins: "10x d0.90, two rows, 1.27mm pitch, 2.54mm row spacing"
      led_pins: "4x d1.02 (pins 11-14)"
      shield_posts: "2x d1.70"
      t_posts: "2x d3.25"
      layout_span: "15.75mm overall, 11.43mm pin field"
    design_notes:
      centre_taps: >
        Pins 5 and 6 are the PHY-side centre-tap common. Bypass to GND with a
        capacitor close to the PHY; they are not left floating.
      leds: >
        The jack's own LEDs replace the discrete LED1/LED2. All three RTL8153B
        LED outputs (LED0 pin 32, LED1 pin 30, LED2 pin 24) are free now that
        the SPI flash is dropped, so yellow plus the bi-colour pair can all be
        driven. LED VF is 1.8-2.6V at 20mA. [OLIMEX] use 1K series resistors,
        giving roughly 1mA - dim but visible, and low power. For a covert
        implant a dim indicator is arguably preferable; a normal-looking link
        LED is however less conspicuous than a dark port. Value to be decided.

# ---------------------------------------------------------------------------
# Nets
# ---------------------------------------------------------------------------
# Format: net name -> list of "REF.pin" endpoints.
# Power rails are listed explicitly rather than implied, so the generator can
# emit real power symbols and the checker can verify every supply pin is fed.
nets:

  GND:
    - U3.29          # GND
    - U3.41          # exposed pad - stitch to In1 with a via array
    - U3.25          # ENSWREG low -> internal SWR disabled (decision 3f)
    - U4.2
    - U6.2
    - J3.4           # USB GND
    - J3.7           # GND_DRAIN
    - J3.SH          # shell / shield
    - R6.2           # buck divider bottom
    - R11.2          # RSET
    - C1.2
    - C2.2
    - C3.2
    - C4.2
    - C5.2
    - C6.2
    - C7.2
    - C8.2
    - C9.2
    - C10.2
    - C11.2
    - C12.2
    - C13.2
    - C14.2
    - C15.2
    - C16.2
    - C17.2
    - C18.2
    - C19.2
    - C20.2
    - C21.2
    - C25.2
    - R13.2
    - Y1.2           # crystal case ground
    - Y1.4

  "+5V":
    - J3.1           # USB VBUS - the board's only power input
    - U3.21          # VDD5
    - U3.27          # VDDREG5
    - U4.1           # LDO in
    - U4.3           # LDO EN - always on
    - U6.4           # buck in
    - U6.5           # buck EN - always on
    - C1.1
    - C2.1
    - C3.1
    - C5.1
    - C18.1

  "+3V3":
    - U4.5           # LDO out
    - U3.11          # AVDD33
    - U3.39          # AVDD33
    - U3.40          # AVDD33
    - U3.23          # DVDD33
    - U3.33          # DVDD33
    - U3.26          # VDDREG33
    - R7.1           # LED series, yellow
    - R8.1           # LED series, green
    - R12.1          # DNP link to AVDD33_LDO, see U3 design_notes.ldo_outputs
    - C6.1
    - C7.1
    - C9.1
    - C10.1
    - C11.1

  "+1V0":
    - L2.2           # buck output after the inductor
    - R5.1           # divider top senses the output
    - U3.3           # AVDD10
    - U3.8           # AVDD10
    - U3.37          # AVDD10
    - U3.34          # DVDD10
    - U3.14          # U3VDD10
    - U3.19          # U2VDD10
    - C4.1
    - C24.1          # DNP feed-forward, see U6 design_notes.feed_forward
    - C12.1
    - C13.1
    - C14.1
    - C15.1
    - C16.1

  # --- Buck ---
  SW_1V0:            # switch node - keep small, F.Cu only
    - U6.1           # LX
    - L2.1
  FB_1V0:
    - U6.3           # FB
    - R5.2
    - R6.1
    - C24.2          # DNP feed-forward

  # --- U3's embedded-LDO outputs: own nets, own caps, no supply rail ---
  # See components.U3.design_notes.ldo_outputs. [RTL-DS] table 6, 6.15.
  AVDD33_LDO:        # pin 20, 3.3V LDO output
    - U3.20
    - C8.1
    - R12.2          # DNP link to +3V3, contingency only
  DVDD10_UPS:        # pin 22, 1.0V LDO output
    - U3.22
    - C17.1

  RSET:
    - U3.38
    - R11.1

  # --- Crystal ---
  XTAL1:
    - U3.35          # CKXTAL1
    - Y1.1
    - C19.1
  XTAL2:
    - U3.36          # CKXTAL2
    - Y1.3
    - C20.1

  # --- USB 2.0 ---
  USB2_D_P:
    - U3.18          # U2DP
    - J3.3
  USB2_D_N:
    - U3.17          # U2DM
    - J3.2

  # --- USB 3.0 SuperSpeed, see design_notes.usb3_crossover ---
  USB3_TX_P:
    - U3.13          # U3SSTXP - device transmits
    - C22.1          # AC-coupling cap, at the transmitter
  USB3_TX_P_CONN:
    - C22.2
    - J3.6           # plug pin named SSRX+ (host receives)
  USB3_TX_N:
    - U3.12          # U3SSTXN
    - C23.1
  USB3_TX_N_CONN:
    - C23.2
    - J3.5           # plug pin named SSRX-
  USB3_RX_P:
    - U3.16          # U3SSRXP - device receives
    - J3.9           # plug pin named SSTX+ (host transmits)
  USB3_RX_N:
    - U3.15          # U3SSRXN
    - J3.8           # plug pin named SSTX-

  # --- MDI pairs to the MagJack, PHY side ---
  MDI0_P: [U3.1,  J2.1]
  MDI0_N: [U3.2,  J2.2]
  MDI1_P: [U3.4,  J2.3]
  MDI1_N: [U3.5,  J2.4]
  MDI2_P: [U3.6,  J2.7]
  MDI2_N: [U3.7,  J2.8]
  MDI3_P: [U3.9,  J2.9]
  MDI3_N: [U3.10, J2.10]

  MDI_CT:            # PHY-side centre-tap common, bypassed to GND
    - J2.5
    - J2.6
    - C21.1

  # --- LEDs in the jack ---
  # Wired as +3V3 -> R -> anode, cathode -> PHY pin, i.e. the pin SINKS. The pin
  # is push-pull and its active level is programmable, so this works when U3 is
  # set LowActive. See design_notes.led_polarity.
  SHIELD:            # RJ45 cable-side shield - see design_notes.shield_tie
    - J2.SH1
    - J2.SH2
    - C25.1          # 1nF/2kV to GND
    - R13.1          # 1M bleed to GND

  LED_Y_A:           # yellow anode node
    - R7.2
    - J2.13
  ETH_LED0:          # yellow cathode -> PHY LED0 sinks
    - J2.14
    - U3.32
  LED_G_A:           # green anode node (11+/12- is green)
    - R8.2
    - J2.11
  ETH_LED1:          # green cathode -> PHY LED1 sinks
    - J2.12
    - U3.30

# ---------------------------------------------------------------------------
# Deliberately unconnected
# ---------------------------------------------------------------------------
no_connect:
  U3.28:
    reason: >
      REGOUT - internal switching regulator is disabled (ENSWREG low), so this
      output is unused. Decision 3f.
  U3.24:
    reason: >
      LED2 - not used. Green plus yellow are enough for link/activity. The
      polarity question that once blocked orange is answered (design_notes.
      led_polarity: push-pull, programmable level), so orange via anti-parallel
      drive of the bi-colour LED is possible - [OLIMEX] Rev E does it between
      LED0 and LED1 - but it needs two pins on opposite levels and is a choice
      left for later, not an open datasheet question. Pin 24 is "LED Mode
      (default)" in [RTL-DS] table 11, and an output (table 7), so leaving it
      open is correct.
  U3.31:
    reason: >
      EECS - no external EEPROM; the part has embedded eFUSE which the
      datasheet says it loads first ([RTL-DS] table 3 note 1, 6.4). EECS is an
      output (table 3, type O) and table 11 gives pin 31 no function outside
      EEPROM mode. The datasheet does not say in so many words that it may
      float; an unused output pin normally may, and [OLIMEX] Rev E ships with
      its EEPROM (U2) unpopulated, leaving this net unterminated.
  U4.4:
    reason: "AP2112K pin 4 is NC by datasheet."

# ---------------------------------------------------------------------------
# Cross-cutting design notes
# ---------------------------------------------------------------------------
design_notes:
  shield_tie: >
    DECIDED 2026-11-01: 1nF/2kV (C25) in parallel with 1M (R13) from SHIELD to
    GND, not a direct tie. A direct tie was the alternative.
    Why: the SHIELD net is the cable-side shield, which at the far end of the
    Ethernet cable is normally bonded to the switch's chassis, while this
    board's GND is the Pi's USB-powered 5V return, which sits behind the PoE+
    HAT's isolated converter (OPEN_QUESTIONS.md item 0; that isolation is as
    stated there and has not been re-verified here). A direct tie would
    give a DC path from the cable shield into that GND, bypassing the isolation
    the HAT provides, and a ground loop through the Pi's own Ethernet cable.
    The 1nF/2kV cap still returns high-frequency common-mode energy and holds
    off the 1500Vrms of the jack's own hipot rating; the 1M bleed stops the
    shield from floating at some arbitrary DC level, which would make it an
    antenna. The jack's internal 1000pF/2kV from its Bob Smith node to SHIELD
    is unchanged by this. Precedent: [OLIMEX] Rev E ties the jack shield to
    GND through a single 1nF/2kV/X7R/1206 (C9); the 1M is added here.
    R13 is a 1206 pad so that fitting a 0R instead gives the direct tie, if EMC
    testing prefers it, without a respin. 1206 rather than 0402 for the higher
    working-voltage rating; how it behaves in a 1.5kV hipot test is not verified.
    J3's USB shield is tied to GND, which is the normal device-side convention.
  usb3_crossover: >
    VERIFIED 2026-11-01 against the connector's own datasheet, [WE-692]. Its
    "Pin Assignment" table for 692112030100 (Gender: Plug, Type A) reads:
    5 StdA_SSRX-, 6 StdA_SSRX+, 7 GND_DRAIN, 8 StdA_SSTX-, 9 StdA_SSTX+. The
    names are the Standard-A, i.e. host, point of view: J3 is an A-*plug* that
    mates with the host's A-receptacle, so the plug pin labelled SSTX is the
    host's transmitter and must feed our receiver, and the pin labelled SSRX is
    the host's receiver and must be fed by our transmitter. U3 side from
    [RTL-DS] table 10: U3SSTXP/N = 13/12 outputs, U3SSRXP/N = 16/15 inputs.
      U3 SSTX 13 (P) -> C22 -> J3 pin 6 (StdA_SSRX+)    P to P, N to N
      U3 SSTX 12 (N) -> C23 -> J3 pin 5 (StdA_SSRX-)
      U3 SSRX 16 (P) <- J3 pin 9 (StdA_SSTX+)
      U3 SSRX 15 (N) <- J3 pin 8 (StdA_SSTX-)
    This is what nets USB3_TX_* / USB3_RX_* wire. Net names follow the
    DEVICE's direction (USB3_TX_* = we transmit). Result: the crossover is
    correct as drawn; no change to pin assignment was needed.
    LIMIT OF THE EVIDENCE: [WE-692] gives the names and numbers. That the
    names are host-side is the USB 3.0 Standard-A convention and is consistent
    with Wuerth's datasheet for its 692122030100 receptacle, which lists the
    same names on the same pin numbers (seen in the same search results, not
    otherwise kept); it is not stated in [WE-692] in those words.
    ADDED WITH THIS CHECK: the netlist had no AC-coupling capacitors in the
    SuperSpeed transmit path. USB 3.0 requires 75-200 nF in series at the
    transmitter; [RTL-DS] does not mention it; [OLIMEX] Rev E has 100nF in each
    TX line. C22 (P) and C23 (N), 100nF 0402, are added at the transmitter.
    The receive pair needs none on our side (the host's TX is already coupled).
    The ESD parts planned for these pairs must go on the connector side of
    C22/C23, or between them and J3, not between U3 and the caps.
  led_polarity: >
    CHECKED 2026-11-01 against [RTL-DS]. The premise "the pins sink" turned
    out to be the wrong question: the datasheet does not make the pins sink or
    source, it makes the level programmable.
    * Table 26 (DC characteristics): Voh >= 0.9*VDD33 at Ioh = -4 mA and Vol <=
      0.1*VDD33 at Iol = 4 mA. These are push-pull outputs rated to source
      and to sink 4 mA.
    * 6.2 tables 12 and 15 (LED Feature Control-1): bits 14:12 of OCP register
      DD90h are the active level of LED2, LED1 and LED0 respectively, 0 =
      "LowActive", 1 = "HighActive"; bit 15 picks Option 1 or 2 of table 17.
      The level is therefore a register field, not a pin property.
    * 6.2 table 16: with no link and no activity the pin is "Floating"; table 7
      note 1: the output level depends on link state and the high/low-active
      setting; with the LAN disabled the pin is 0 V.
    What the datasheet does NOT give: the power-on default of those bits. So
    which polarity the part comes up in is NOT settled by the datasheet.
    Decision: keep the wiring (anode -> R -> +3V3, cathode -> LED pin). It works
    when the pin is LowActive (pin driven low = LED lit; pin floating = LED
    off). [OLIMEX] Rev E wires its yellow LED as a sink too: anode to +3.3V,
    cathode through R1 1K to the LED2 pin (resistor on the cathode side, which
    is electrically the same as the anode-side resistor used here). If U3 powers up HighActive the
    LED stays dark (the pin drives high into a cathode, reverse bias; no
    current, no damage) and the fix is the register bit, not the board,
    so the resistor-to-cathode-side swap is NOT needed. Current: 1k with VF
    1.8-2.6 V gives about 0.7-1.5 mA, well under the 4 mA the pin is rated for.
    NEEDS CONFIRMATION ON FIRST BUILD: link a cable and see whether the LEDs
    light for link; if inverted or dark, clear DD90h bits 14:12 (0 =
    LowActive).
    Other facts from the datasheet for the record: pins 24/30/32 default to LED
    mode (table 11), the LEDs may blink at power-on or during EEPROM/SPI access
    (5.11), and "LED OFF Mode" (all select bits 0) makes the pins float.
  mdi_pair_mapping: >
    J2 PHY-side pins carry to cable pins as: TD1 -> J1/J2, TD2 -> J3/J6,
    TD3 -> J4/J5, TD4 -> J7/J8 ([LPJG] sheet 1/2). That is the standard
    1000BASE-T assignment. AutoMDX in both the PHY and the jack means pair
    order and polarity are corrected automatically, so exact pair-to-pair
    assignment is not critical - but keep each pair routed as a pair.
  rail_currents: >
    Not specified in [RTL-DS]. The +1V0 design point is 1 A (U6 does 2 A), and
    U4 is a 600 mA LDO on +3V3. Measure both on the first build and revisit if
    the LDO runs hot - a GbE PHY's 3.3V draw can approach a few hundred mA.
