# Raccoon Tap v2 — authoritative netlist
#
# Architecture: Option A (see OPEN_QUESTIONS.md item 0). PoE is handled by the
# official Raspberry Pi PoE+ HAT; this board is only the USB 3.0 -> Gigabit
# Ethernet tap and draws its power from the USB port it plugs into.
#
# This file is the source of truth. tools/gen_schematic.py generates
# kicad/raccoon-hat.kicad_sch from it. Every pin number carries a provenance
# note; nothing here is inferred.
#
# Sources:
#   [RTL-DS]  RTL8153B-VB-CG datasheet rev 1.4, Track ID JATR-8275-15,
#             pin tables 5.1-5.11 and pin assignment figure p.4
#   [RTL-614] same, 6.14 Switching Regulator
#   [RTL-615] same, 6.15 LDO Regulator
#   [AP-DS]   AP2112 datasheet (Diodes Inc)
#   [GUIDE]   design-guide.md
#   [OLIMEX]  Olimex USB-GIGABIT Rev.E, OSHW UID BG000059, CERN OHL v1.2,
#             github.com/OLIMEX/USB-GIGABIT - connectivity traced from the
#             KiCad schematic, values from USB-GIGABIT_Rev_D_BOM.csv.
#             CAVEAT: Olimex use the RTL8153VC-CG (QFN-48, 6x6mm), not the
#             RTL8153B-VB (QFN-40, 5x5mm) used here. Pin numbers do NOT map.
#             Values are usable as an engineering reference only where the
#             function is variant-independent; each is annotated below.
#   [LPJG]    LINK-PP LPJG16402AQNL drawing LP11021122 rev A, sheets 1/2 and
#             2/2, read from the rendered drawing. UL file E484635.
#   [VERDICT] hardware/review/u3-pinout-verdict.md - the Task 3 gate result: every
#             U3 pin number and the roles of pins 20 and 22, taken from [RTL-DS].
#             Section numbers below ("Table 6", "6.15") are [RTL-DS] unless stated.
#   [ABM8]    Abracon ABM8 ceramic SMD crystal datasheet, revised 2020-07-29,
#             hardware/datasheets/ABM8_abracon_rev2020-07-29.pdf (md5 57e1ee1bde6f9bb895f0c55dde98b00b)
#   [USB3]    Universal Serial Bus 3.0 Specification, Revision 1.0 (USB-IF,
#             12 Nov 2008), section 5.3.1.2, Table 5-2 "USB 3.0 Standard-A
#             Connector Pin Assignments", with its note "Tx and Rx are defined
#             from the host perspective". Obtainable from usb.org. Read here from
#             a third-party mirror copy (md5 e819db9ff88967934f85d210666c7519,
#             not committed: it is the USB-IF's document).
#   [WE-692]  Wuerth Elektronik 692112030100 datasheet (WR-COM USB 3.0 SMT Plug,
#             order code 692112030100, rev BBO 002.000, 2022-04-28), pin
#             assignment table. OPEN ITEM: no copy of this PDF is committed. It
#             was read only as search-extracted text of
#             https://www.we-online.com/components/products/datasheet/692112030100.pdf
#             because we-online.com refuses scripted download (HTTP 403). A
#             person must download it by hand, commit it under
#             hardware/datasheets/ and record its md5 here (carried into the
#             ordering instructions, Task 11). Until then [WE-692] is
#             corroboration only; [USB3] is the primary citation.
#   [TPS22810] Texas Instruments TPS22810 datasheet SLVSDH0C (Jan 2018),
#             hardware/datasheets/TPS22810_ti_SLVSDH0C_rev2018-01.pdf
#             (md5 3536ca9887499c581816dca1222a2f91)
#   [USBLC6]  STMicroelectronics USBLC6-2 datasheet DS4260 rev 7 (Dec 2021),
#             hardware/datasheets/USBLC6-2_st_DS4260_rev7_2021-12.pdf
#             (md5 fa379493b82aadae4fccf90ce4800649)
#   [AP2112]  Diodes Inc AP2112 datasheet DS39724 rev 2-2,
#             hardware/datasheets/AP2112_diodes_DS39724_rev2-2.pdf
#             (md5 108c38271beb03462b5c4b6c8f6536d5)
#   [SP3019]  Littelfuse SP3019 series datasheet, revision 01/25/18,
#             hardware/datasheets/SP3019_littelfuse_rev2018-01-25.pdf
#             (md5 54393f118f8c7b7301cd09a710708d61), obtained from
#             catalogue2.pss-electrocomponents.com/catalogue/463/SP3019-04HTG.pdf
#             after littelfuse.com and mouser.com refused scripted download. Its
#             cover reads "Low Capacitance ESD Protection - SP3019" and
#             "SP3012 Series": a family sheet in which the SOT23-6L drawing and
#             block diagram are the SP3012-04HTG ones. Page 1 holds the pinout
#             (top view, 1 2 3 along the bottom, 6 5 4 along the top) and the
#             functional block diagram (I/O = pins 1, 3, 4, 6, GND = pin 2; pin
#             5 is drawn on the package and absent from the diagram). A later
#             revision (08/16/22, read only as search-extracted text of the
#             littelfuse.com asset) adds the sentence "Note: PIN 5 is NC"; the
#             two agree. Page 2: 0.3 pF typ I/O-to-GND at 3 GHz, 0.18 pF
#             I/O-to-I/O, no maximum published. Datasheet revision 01/25/18 is
#             older than the product page; the electrical figures were
#             compared with the 2022 text and match.
#   [TI-ESD]  Texas Instruments SLVAF82B rev B (Jan 2024), "ESD and Surge
#             Protection for USB Interfaces",
#             hardware/datasheets/TI_SLVAF82B_ESD-USB_rev-B_2024-01.pdf
#             (md5 f4b872aa5ecade54a2725a96892d6fcb). Section 4.2: SuperSpeed
#             lines "less than 0.5pF"; D+/D- "less than 4pF"; IEC 61000-4-2
#             8 kV contact / 15 kV air.
#   [SLYT118] Texas Instruments SLYT118, "Powering electronics from the USB
#             port" (2005),
#             hardware/datasheets/TI_SLYT118_Powering-from-USB_2005.pdf
#             (md5 c1c8541851b79dc95dbd220f56ced0ca). Table 1: maximum input
#             capacitor 10 uF, maximum inrush 50 uC, low-power current 100 mA.
#             SECONDARY source for the USB 2.0 section 7.2.4.1 wording ("if
#             more bypass capacitance is required ... some form of VBUS surge
#             current limiting"); the USB-IF text itself was not read here.
#   [SY8089]  Silergy Application Note AN_SY8089/A rev 0.9A (2013-01-06),
#             hardware/datasheets/SY8089_silergy_AN_rev0.9A_via-lcsc.pdf
#             (md5 7c45f31bd305a2bc06e60e6a38ffcc56), downloaded from LCSC
#             (C78988). The footer reads "Silergy Corp. Confidential - Prepared
#             for Customer Use Only"; LCSC and Olimex both publish it openly.
#             Page 4, electrical characteristics: soft-start time TSS 1.2 ms in
#             the Typ column only; input UVLO threshold VUVLO 2.5 V in the Max
#             column only (hysteresis 0.2 V typ); VIN 2.7-5.5 V; PFET current
#             limit 3.5 A min. No minimum soft-start time and no minimum UVLO
#             is published: the inrush model uses the typical TSS and the
#             maximum UVLO, which is why it cannot bound the peak.
#   [SOURCING] hardware/review/part-sourcing.md - manufacturer, part number,
#             package, lifecycle and stock for every BOM row, checked
#             2026-11-01. U3 separately in hardware/review/u3-sourcing.md.
#   [TBD]     not determinable from available documents - see OPEN_QUESTIONS.md

meta:
  board: Raccoon Tap
  revision: "2.1-draft"
  architecture: "Option A - USB-powered GbE tap, PoE via Pi PoE+ HAT"
  date: "2026-11-01"
  routed: false
  erc_clean: false

# ---------------------------------------------------------------------------
# Stackup
# ---------------------------------------------------------------------------
# Decision 2026-09-25: 4 layers. Two independent reasons:
#   1. USB 3.0 SuperSpeed at 5 Gbit/s needs a controlled-impedance reference
#      plane directly under the signal layer. This is not optional.
#   2. It makes the buck and the MDI pairs far more forgiving, which is the
#      stated goal: lowest risk, robust layout.
stackup:
  layers: 4
  thickness: "1.6 mm"
  copper: "1 oz outer, 1 oz inner (0.5 oz inner is acceptable if the fab prefers)"
  assignment:
    F_Cu: "signals - USB 3.0 pairs, MDI pairs, and the buck's hot loop"
    In1_Cu: "solid GND plane - unbroken reference under every high-speed pair"
    In2_Cu: "power - +5V, +3V3, +1V0 pours"
    B_Cu: "signals and a second GND pour"
  impedance:
    usb3_superspeed: "90 ohm differential, +/-10%, referenced to In1 GND"
    usb2_dp_dm: "90 ohm differential"
    mdi_pairs: "100 ohm differential, referenced to In1 GND"
    note: >
      Ask the fab for a stackup that hits these targets at their actual core
      and prepreg thicknesses. Do not assume a trace geometry - JLCPCB, PCBWay
      and Aisler all publish impedance calculators for their 4-layer stacks.
  rules:
    - "Never break the In1 GND plane under a differential pair."
    - "Length-match within a pair: USB 3.0 <=2 mm, MDI <=5 mm. [GUIDE] 4."
    - "Keep the buck hot loop (U6 IN -> LX -> L2 -> COUT -> GND) small and on F_Cu."
    - "Keep the R5/R6 divider and its FB trace away from the LX switch node. [SY8089]"
    - "U3 exposed pad (pin 41) is GND: stitch to In1 with a via array."
    - >
      J2 is the isolation barrier. Keep the cable-side SHIELD pour separate from
      signal GND, joined only at the intended single point. The jack's internal
      1000pF/2kV already bridges the BST node to SHIELD.

# ---------------------------------------------------------------------------
# Power rails
# ---------------------------------------------------------------------------
rails:
  "+5V":
    source: "J3 USB VBUS, raw: the connector side of the load switch U7"
    range: "4.5 - 5.5 V"
    nominal_v: 5.0
    note: >
      [RTL-DS] table 21: VDD5 min 4.5 typ 5.0 max 5.5. Only C1 (1 uF) and C2
      (100 nF) hang on this net, plus U7's input and U9's VBUS clamp: this is
      the capacitance the host sees at attach, and it is what the 10 uF USB
      limit is checked against (check_fab_release.py). Everything else on 5 V
      is behind U7 on +5V_SW. See design_notes.vbus_inrush.
  "+5V_SW":
    source: "U7 TPS22810 output: soft-start load switch from +5V"
    range: "VBUS minus I x RON (RON 79 mOhm typ, 105 mOhm max to 85 C, [TPS22810] 7.5)"
    nominal_v: 5.0
    note: >
      The board's 5 V supply for U3 (VDD5, VDDREG5), U4 and U6. Slew-limited
      by C26 on U7's CT pin. The bulk capacitance (C3 10 uF, C5 1 uF, C18
      100 nF) sits here, not on raw VBUS. `gated_by` and `downstream_rails`
      below are read by check_fab_release.py, which models the attach-time
      charging current in phases: U4 as a linear regulator whose output
      tracks its input, U6 as a buck with its own soft-start. They are data,
      not decoration. The model parameters sit on U4 (`tracking`) and U6
      (`soft_start`).
    gated_by:
      switch: U7
      ct_cap: C26
    downstream_rails:
      "+3V3":
        via: U4
        model: ldo
        nets: ["+3V3_REG", "+3V3"]
      "+1V0":
        via: U6
        model: buck
        nets: ["+1V0_REG", "+1V0"]
  "+3V3":
    source: "U4 AP2112K-3.3 output, through the cut-open link JP1"
    range: "3.14 - 3.46 V"
    nominal_v: 3.3
    note: >
      [RTL-DS] table 21: DVDD33/AVDD33. This is the LOAD side of JP1. The
      regulator side is the net +3V3_REG (U4 output, C6). Cut JP1 and put an
      ammeter across its pads to measure the rail current on the first build.
  "+1V0":
    source: "U6 SY8089AAAC external buck (ENSWREG tied low, internal SWR disabled), through the cut-open link JP2"
    range: "0.95 - 1.05 V"
    nominal_v: 1.0
    note: >
      This is the LOAD side of JP2; the regulator side is the net +1V0_REG
      (L2, C4, the R5/R6 feedback divider). Cut JP2 and put an ammeter across
      its pads to measure the rail current on the first build.
      [RTL-DS] table 21 gives the 0.95-1.05 V window for DVDD10, AVDD10,
      U3VDD10, U2VDD10 (and DVDD10_UPS, which is NOT fed from this rail: it is
      an LDO output, see U3 design_notes.ldo_outputs). Connection rule for this
      rail: [RTL-DS] 6.14 - REGOUT's 1.0 V output "must be connected only to
      DVDD10, AVDD10, U3VDD10, and U2VDD10"; this rail takes REGOUT's place, so
      the same four pin groups, and only those, hang on it.
      Decision 2026-09-25: external buck rather than the chip's internal
      switching regulator, on a 4-layer board. Rationale in OPEN_QUESTIONS.md
      item 3f - [RTL-614] warns the internal SWR "requires a well-designed PCB
      layout in order to achieve good power efficiency and lower the output
      voltage ripple and input overshoot", and an external buck removes that
      risk entirely. Consequence: ENSWREG (25) -> GND, and REGOUT (28) is left
      unconnected.
  GND:
    source: "J3 USB GND, U3 pin 29 and exposed pad 41"

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:

  U3:
    value: RTL8153B
    mpn: RTL8153B-VB-CG
    manufacturer: Realtek
    package: QFN-40, 5x5mm, exposed pad
    footprint: "Package_DFN_QFN:QFN-40-1EP_5x5mm_P0.4mm_EP3.6x3.6mm"
    description: USB 3.0 to Gigabit Ethernet controller
    source: >
      [RTL-DS] - 40 pins + exposed pad = pin 41. All 41 pin numbers confirmed
      against [RTL-DS] tables 1-10 and figure 1 in three copies of the PDF,
      see [VERDICT] sec. 3; re-run with
      `python3 hardware/datasheets/crosscheck_u3_pinout.py`.
    pins:
      1:  {name: MDIP0,      type: bidirectional}
      2:  {name: MDIN0,      type: bidirectional}
      3:  {name: AVDD10,     type: power_in}
      4:  {name: MDIP1,      type: bidirectional}
      5:  {name: MDIN1,      type: bidirectional}
      6:  {name: MDIP2,      type: bidirectional}
      7:  {name: MDIN2,      type: bidirectional}
      8:  {name: AVDD10,     type: power_in}
      9:  {name: MDIP3,      type: bidirectional}
      10: {name: MDIN3,      type: bidirectional}
      11: {name: AVDD33,     type: power_in}
      12: {name: U3SSTXN,    type: output}
      13: {name: U3SSTXP,    type: output}
      14: {name: U3VDD10,    type: power_in}
      15: {name: U3SSRXN,    type: input}
      16: {name: U3SSRXP,    type: input}
      17: {name: U2DM,       type: bidirectional}
      18: {name: U2DP,       type: bidirectional}
      19: {name: U2VDD10,    type: power_in}
      20: {name: AVDD33,     type: power_out, note: "Treated as an LDO 3.3V OUTPUT, kept off +3V3: [RTL-DS] table 6 'AVDD33 P 20 Linear Regulator (LDO) 3.3V Output... internal use only'; table 8 lists it with the AVDD33 supplies, so the datasheet does not settle it. Own output cap; R12 DNP can join it to +3V3. See design_notes.ldo_outputs."}
      21: {name: VDD5,       type: power_in}
      22: {name: DVDD10_UPS, type: power_out, note: "LDO 1.0V OUTPUT, not a supply input: [RTL-DS] table 6 'DVDD10_UPS P 22 Linear Regulator (LDO) 1.0V Output', 6.15 notes 1 and 2. Own output cap, NOT on +1V0. See design_notes.ldo_outputs."}
      23: {name: DVDD33,     type: power_in}
      24: {name: LED2,       type: output,   shared: "EEDO/LED2/SPISDO/LANWAKEB/GPIO"}
      25: {name: ENSWREG,    type: input,    shared: "EEDI/SPISDI/ENSWREG"}
      26: {name: VDDREG33,   type: power_in}
      27: {name: VDDREG5,    type: power_in}
      28: {name: REGOUT,     type: power_out}
      29: {name: GND,        type: power_in}
      30: {name: LED1,       type: output,   shared: "EESK/LED1/SPISCK"}
      31: {name: EECS,       type: output}
      32: {name: LED0,       type: output,   shared: "LED0/SPICSB"}
      33: {name: DVDD33,     type: power_in}
      34: {name: DVDD10,     type: power_in}
      35: {name: CKXTAL1,    type: input}
      36: {name: CKXTAL2,    type: bidirectional}
      37: {name: AVDD10,     type: power_in}
      38: {name: RSET,       type: input}
      39: {name: AVDD33,     type: power_in}
      40: {name: AVDD33,     type: power_in}
      41: {name: GND,        type: power_in, note: "exposed pad"}
    design_notes:
      rset: >
        RSET (38) takes a precision resistor to GND. [OLIMEX] traced:
        U3.RSET -> R8.1, R8.2 -> GND, R8 = 2.49k 1% 0402. The pin sets an
        internal current reference, which is a variant-independent function,
        so 2.49k 1% is a sound starting value - but it comes from the VC
        variant and is not stated in the VB datasheet. Verify on first build.
      enswreg: >
        ENSWREG (25, shared with SPISDI) is a power-on latch: 3.3V enables the
        internal switching regulator, 0V disables it and requires external 1.0V.
        [OLIMEX] tie it to GND and feed the low-voltage rail from an external
        SY8089 buck + 2.2uH inductor, with a 1:1 divider (R12=R15=1.1k 1%).
        DO NOT copy that divider: the SY8008 family reference is 0.6V, so a 1:1
        divider gives 1.2V, whereas [RTL-DS] table 21 specifies 0.95-1.05V for
        this variant's AVDD10/DVDD10/U3VDD10/U2VDD10. Decision open - see
        OPEN_QUESTIONS.md item 3f.
      lowv_rail_fanout: >
        CORRECTED 2026-11-01 (an earlier revision also listed DVDD10_UPS (22);
        that was wrong, see ldo_outputs). Whichever source is used, the 1.0V
        rail reaches AVDD10 (3, 8, 37), DVDD10 (34), U3VDD10 (14) and
        U2VDD10 (19), and nothing else. Source: [RTL-DS] 6.14 "REGOUT ... must
        be connected only to DVDD10, AVDD10, U3VDD10, and U2VDD10 (do not
        provide this power source to other devices)"; table 8 for the pin
        numbers (AVDD10 3/8/37, DVDD10 34, U3VDD10 14, U2VDD10 19). The earlier
        text traced to [OLIMEX], which is the RTL8153VC-CG, a different part.
        The rail has C12-C16 (five 100nF) plus C4 (22uF) at the buck; the
        Olimex count of 9 caps is for their variant and is not copied.
      ldo_outputs: >
        DECIDED 2026-11-01. Two pins of U3 are outputs of its embedded linear
        regulators, not supply inputs, and neither is connected to a supply
        rail of this board.
        (1) DVDD10_UPS (22): [RTL-DS] table 6 "Linear Regulator (LDO) 1.0V
        Output. Note: The embedded LDO is designed for RTL8153B-VB internal use
        only. Do not provide this power source to other devices."; 6.15 note 1
        (same), note 2 "The digital LDO output pin (DVDD10_UPS) should be
        separated from the other 1.0V SWR output pin (REGOUT)"; 6.14 lists the
        pins REGOUT may feed and 22 is not among them; 6.15 asks for "only an
        output capacitor between its output and analog ground for phase
        compensation", placed "as close as possible to the power pins". This
        design drives the +1V0 rail from U6 instead of REGOUT, and that rail
        takes REGOUT's place, so pin 22 is likewise kept off it. Pin 22 now has
        its own net (DVDD10_UPS) with C17 to GND as the output capacitor.
        C17 VALUE: the datasheet gives no capacitance. 100nF is kept because
        [OLIMEX] Rev E fit exactly 100nF/X5R/0402 (C22) on DVDD10_UPS, on its
        own net, off the 1.0V rail, with REGOUT left open as here. That is a
        different die and package (VC, QFN-48), so it is a precedent for the
        function, not a datasheet value. NEEDS CONFIRMATION ON FIRST BUILD:
        probe pin 22 for ~1.0V with a quiet waveform. The footprint is 0402, so
        a 1uF X5R drop-in is possible if it rings; no respin.
        (2) AVDD33 (20): [RTL-DS] table 6 "AVDD33 P 20 Linear Regulator (LDO)
        3.3V Output" with the same internal-use-only note as REGOUT and pin 22;
        6.15 note 1 covers "the embedded LDO". Table 8 lists pin 20 inside the
        AVDD33 supply group (11, 20, 39, 40) and table 21 lists "DVDD33, AVDD33"
        by name, not by pin.
        THE DATASHEET DOES NOT SETTLE PIN 20. Three readings fit it:
          H1  LDO output for internal use only, to carry its own cap and nothing
              else (the reading this board is wired for).
          H2  LDO output whose job is to supply the chip's OWN AVDD33 group
              (11, 39, 40). The phrase "internal use only. Do not provide this
              power source to other devices" is attached to REGOUT in table 6
              too, and 6.14 REQUIRES REGOUT to be wired to the chip's own
              DVDD10/AVDD10/U3VDD10/U2VDD10. In this datasheet the phrase
              therefore means "no other chips", not "do not wire it to this
              chip's own supply pins". Table 8's grouping of pin 20 with
              11/39/40 fits this reading well. It is also how Olimex Rev E
              wires the matching pin (below).
          H3  A plain 3.3V supply input like its group neighbours (table 8
              read literally).
        Argument for table 6 over table 8: table 6 is the only row describing
        pin 20 on its own; and the same document calls pin 22 a "Digital 1.0V
        Uninterruptible Power Supply" in table 8 and lists DVDD10_UPS as a supply
        in table 21, yet 6.15 note 2 settles pin 22 as an output. So tables 8
        and 21 do not distinguish an LDO output from an input, and are not
        evidence against table 6. That argument favours H1 or H2 over H3. It
        does NOT choose between H1 and H2: the "internal use only" phrase cannot
        be read as "isolate this pin", because REGOUT carries it and is meant to
        be wired to the chip. Unlike pin 22 there is no 6.14/6.15 sentence
        naming pin 20 and saying what it may touch.
        DECISION (unchanged action): pin 20 is kept off +3V3, on its own net
        AVDD33_LDO with C8 to GND, and R12 (0R, DNP) can join it to +3V3. Why
        this stands under all three readings: under H1 it is exactly right; under
        H2 the chip's own LDO still supplies whatever sits behind pad 20 and
        11/39/40 are fed from +3V3, which is the arrangement Olimex use for
        everything but the one pin, and fitting R12 gives their wiring exactly;
        under H3 the first power-up shows it and R12 is the fix.
        THE RISK, STATED AS IT IS (replaces an earlier version that overstated
        it): paralleling an LDO output with a 3.3V rail is NOT destructive on
        its face. An LDO's pass device cannot sink current, so a stiff parallel
        rail at or above its set point simply turns it off, and a rail below it
        just takes a share. What it costs is unspecified behaviour: the LDO
        loses its defined load, possible reverse leakage through the pass
        device into VDDREG5/VDD5 if +3V3 outlasts +5V at power-down, and noise
        coupling between the two. Leaving pin 20 isolated costs, under H3 or
        under an H2 where the pad has no on-die link to 11/39/40, a part of the
        analogue domain that may be underpowered. So the thing to weigh when
        deciding about R12 is "unspecified-but-probably-benign parallel
        sources" against "possibly-underpowered domain", not "destroyed versus
        fine". Neither choice was shown to be safe by the datasheet; the
        isolation is chosen because it follows table 6 and the pin 22 precedent
        and is reversible with one 0603.
        [OLIMEX] Rev E (VC variant): the AVDD33 pin sitting next to VDD5 (their
        pin 25, the analogue of our 20 by position, not by datasheet) is tied to
        the common external 3.3V. Their datasheet was not available to check
        whether that pin is an LDO output there. This is the evidence for H2 and
        H3 and is not outweighed here. A web-search snippet of a paywalled
        reference-schematic overview ("Place C10 close to VDD33 pin 20
        (reserved)") hints at a cap of its own on pin 20; seen only as a
        snippet, not relied on.
        PIN 20 CAP: C8, 2.2uF X5R 16V 0603 (a deliberate, recorded deviation from spec 5.1, see C8 and design_notes.bom_and_dnp; it was 10V 0402 before task 6). The datasheet gives no value; an
        LDO output capacitor "for phase compensation" is typically 1-10uF
        ceramic, 2.2uF is the middle, and DC bias at 3.3V takes part of it away (less in 0603 at 16 V than
        in the 10 V 0402 it replaced; the effective value was not looked up),
        still inside that range. NEEDS CONFIRMATION ON FIRST
        BUILD.
        FIRST-BUILD PROCEDURE FOR PIN 20 (thresholds are engineering judgement,
        anchored on table 21's 3.14V minimum for AVDD33, not datasheet values).
        A bare voltage reading does NOT tell the cases apart: with R12 open, a
        pin bonded on-die to the AVDD33 group and an LDO output both read about
        3.3V. So use all of these, in this order, with R12 open:
          1. Board unpowered. Measure resistance (or diode-mode drop) from pin
             20 (C8.1) to +3V3 (e.g. C7.1). Low ohms (< ~10 ohm): pin 20 is the
             same on-die node as 11/39/40, R12 is redundant and stays empty,
             stop. Otherwise it is a separate node: continue.
          2. Powered, no cable. V(pin 20) against GND:
               >= 3.14V and quiet (< 50 mV p-p): an LDO is driving it.
               < 3.14V but > 0.5V (typically 2.5-3V is a reviewer's estimate, not a
                 measurement, for a domain held up through ESD diodes): neither clean output nor
                 supply; treat as H3, go to step 3 and expect to fit R12.
               < 0.5V: not driven by anything; H3, fit R12.
          3. Functional check with R12 open: the Pi must enumerate it at
             SuperSpeed (lsusb -t shows 5000M, not 480M) and the Ethernet link
             must reach 1000 Mb/s and hold a 5 minute iperf3 at line rate with
             no errors. Pass: leave R12 empty. Fail or falls back to USB 2.0:
             fit R12, repeat; a pass now means pin 20 needed 3.3V from outside.
          4. Supply-current comparison, using the +3V3 series bridge: record the
             +3V3 rail current at 1000 Mb/s with R12 open and then fitted
             (table 26 Icc33 typ 70 mA). A shift of more than ~10 mA means the
             pin 20 domain is a real load that moves between sources. Record it;
             it corroborates steps 2 and 3 but is not decisive alone.
      decoupling_reference: >
        [OLIMEX] total 18x 100nF 0402 plus 2x 2.2uF 0603 across all rails.
        The repo currently has far fewer. Count and placement to be settled
        during layout, not here.

  U4:
    value: AP2112K-3.3
    mpn: AP2112K-3.3TRG1
    manufacturer: Diodes Incorporated
    package: SOT-23-5
    footprint: "Package_TO_SOT_SMD:SOT-23-5"
    description: "3.3V 600mA LDO from +5V_SW; its output (+3V3_REG) reaches +3V3 through JP1"
    source: "[AP-DS]. Required - see OPEN_QUESTIONS.md 3d. Thermal and current check in design_notes.rail_currents."
    tracking:
      dropout_assumed_v: 0.25
      source: >
        Inrush model, check_fab_release.py. A linear regulator's output follows
        its input until the input is within the dropout voltage of the set
        point, so the capacitance behind U4 charges at the input's slew rate
        while VIN is below 3.3 V + dropout. [AP2112] gives VDROP 250 mV typ at
        600 mA for the 3.3 V part (125 mV at 300 mA, 5 mV at 10 mA); 0.25 V is
        taken, which lengthens the window and so overlaps the buck's start
        more: the pessimistic side. [AP2112] also quotes a 50 mA short-circuit
        current at VOUT = 0 and a 20 us start-up time; the charging current
        here (about 23 mA into 10.4 uF) stays below that 50 mA.
    pins:
      1: {name: VIN,  type: power_in}
      2: {name: GND,  type: power_in}
      3: {name: EN,   type: input}
      4: {name: NC,   type: no_connect}
      5: {name: VOUT, type: power_out}

  Y1:
    value: 25MHz
    mpn: ABM8-25.000MHZ-D2Y-T
    manufacturer: Abracon
    package: "3225"
    footprint: "Crystal:Crystal_SMD_3225-4Pin_3.2x2.5mm"
    description: "25MHz crystal for U3 clock reference, CL 18pF, +/-30ppm over temperature"
    source: >
      [RTL-DS] 7.4 table 23 and 'Supports 25MHz Crystal'. Part chosen against
      table 23, checked item by item against [ABM8]:
        Fref 25 MHz fundamental, AT-cut ...... ABM8 fundamental 8-54 MHz       OK
        Stability +/-30 ppm, 0..70 C ......... option code Y = +/-30 ppm, and
                                               code D = -40..+85 C, a superset OK
        Tolerance +/-50 ppm at 25 C .......... code 2 = +/-20 ppm              OK
        CL 16-20 pF .......................... standard CL 18.0 pF             OK
        ESR max 70 ohm; 50 ohm at C0 = 3 pF
        (table 23 note 3) .................... ABM8 table 1: 50 ohm max for
                                               20.000-29.999 MHz fundamental,
                                               C0 3.0 pF                       OK, at the limit
      Not met on paper: table 23 gives "DL Drive Level ... max 0.3 mW" and
      [ABM8] rates 100 uW max. Whether table 23 means the crystal must tolerate
      0.3 mW or that U3 drives no more than 0.3 mW is not stated, so up to 3x
      overdrive cannot be excluded from the documents. OPEN. (An earlier version
      of this note said every 3225 25 MHz part is rated 100 uW; that is wrong:
      Epson's current TSX-3225 datasheet, X1E0000210427, rates 200 uW max, for
      24.576 MHz at CL 12 pF. I did not find an orderable 25 MHz part in that
      family or another with CL inside 16-20 pF, +/-30 ppm and a >=200 uW rating
      whose datasheet could be checked, so ABM8 stays.)
      HAND-SOLDERABILITY (ruling AC, task 6 review): the ABM8 has four pads
      under the body and is not comfortable to solder with an iron. The part
      stays: it was checked point by point against Table 23 and that work is
      not discarded. Two-sided mitigation: (1) task 11 adds Y1 to PCBWay's
      partial assembly together with U3, so the crystal is machine-placed on
      the first boards (part-sourcing.md and u3-sourcing.md carry the
      consequences: two parts to place, Y1 sourced from Abracon via
      DigiKey/Mouser or consigned); (2) task 8 draws Y1 with an extended-pad
      footprint, pads lengthened beyond the body, so a hand rework of a
      crystal that is not in the right place is possible at all. A 3225
      crystal with side-visible terminations would be the other way out; it is
      not chosen here.
      HARDWARE HOOK: R14, a 0402 0R series resistor between CKXTAL2 and the
      crystal, so the drive can be reduced on the bench without a respin. See
      design_notes.drive_level for the measurement and the trim rule. A crystal
      rated 200 uW or more is the second remedy if trimming is not enough.
      Variant-code decode (D2Y) is read from the ordering-option table of
      [ABM8]; distributor listings disagree on whether the D2Y tolerance is
      +/-20 or +/-50 ppm. Either satisfies table 23, but confirm on the order
      confirmation that the stability is +/-30 ppm.
      Footprint: pads 1 and 3 are the crystal terminals, pads 2 and 4 are GND
      ([ABM8] outline, top view). [ABM8] land pattern is a 2.3 x 1.75 mm pitch;
      the KiCad 3225-4Pin footprint is 2.2 x 1.6 mm - 0.1 mm off, within what
      the 1.3 x 1.05 mm pads absorb. An earlier revision of this file said
      package "3215", which is a 3.2 x 1.5 mm part; corrected.
    design_notes:
      load_caps: >
        CALCULATED 2026-11-01, replaces the 39pF placeholder.
        Series combination of the two caps plus stray capacitance must equal the
        crystal's CL: CL = C19*C20/(C19+C20) + Cstray; with C19 = C20 = C that
        is CL = C/2 + Cstray, so C = 2*(CL - Cstray).
        CL = 18 pF ([ABM8] standard). Cstray = 4 pF assumed (two 0402 pads, a
        short trace, U3's CKXTAL pins and the crystal's own pad capacitance;
        3-5 pF is the usual range, this is an assumption, not a measured value).
        C = 2*(18 - 4) = 28 pF -> nearest E24 value 27 pF.
        27 pF is also exactly what [RTL-DS] 7.4 table 23 notes 3 and 4 give:
        "the latest reference schematic recommends two external capacitors of
        27pF ... To match this use the load capacitance specified by the crystal
        manufacturer of 16~20pF." With 27 pF: CL = 13.5 + 4 = 17.5 pF; across
        Cstray 3-5 pF, CL = 16.5-18.5 pF, inside the 16-20 pF window of table 23.
        The earlier placeholder, 39 pF from [OLIMEX], would give CL = 19.5 + 4 =
        23.5 pF here: outside the 16-20 pF window, so the crystal would run low
        in frequency.
        Use C0G (NP0) 50V 0402, 5% or better, for stability.
        R14 sits between U3 pin 36 (CKXTAL2, the output, [RTL-DS] table 5) and
        the crystal node, ahead of C20, so with R14 = 0R the load is unchanged
        (a 0402 pad adds a fraction of a pF, inside the Cstray assumption).
      drive_level: >
        OPEN ITEM, see Y1.source. The crystal is rated 100 uW ([ABM8]); the
        chip's side is only "DL Drive Level max 0.3 mW" ([RTL-DS] table 23).
        MEASURE, do not guess. Drive level is P = I_rms^2 * ESR, where I_rms is
        the current through the crystal; the amplitude at the pin is not the
        drive level, but it gives the current:
          I_rms = 2 * pi * f * V_rms * (C0 + CL)   (standard crystal-drive
          formula, applied here with f = 25 MHz, C0 = 3 pF, CL_total about 21 pF
          including stray; not from the datasheets)
        Measure V p-p at CKXTAL1 (crystal side) with a probe of 1 pF or less
        (a normal 10:1 probe adds 10-15 pF and detunes it), V_rms = Vpp/(2*sqrt 2)
        for a sine. Worst case ESR 50 ohm ([ABM8] table 1). Worked numbers:
        100 uW at 50 ohm is I = 1.41 mA, V_rms = 0.43 V, so about 1.2 V p-p;
        0.3 mW would be about 2.1 V p-p. A current probe round the crystal lead
        gives I directly and avoids the formula if one is available.
        RULE: Vpp at CKXTAL1 <= ~1.2 V with R14 = 0R: leave as is. Above it,
        fit a larger R14 until it is under; the value is found on the bench,
        none is sourced here. If the amplitude then drops so far that start-up
        becomes unreliable (check cold start 20 times), replace the crystal with
        one rated 200 uW or more instead.
    pins:
      # SMD3225/4 standard numbering: 1 and 3 are the crystal terminals,
      # 2 and 4 are the case ground pads. An earlier revision had 1/2 as the
      # two terminals, which would have grounded one electrode and left the
      # other floating. Caught when pcbnew reported pads 3 and 4 with no net.
      # Confirmed against [ABM8] outline drawing, top view: GND on pads 2 and 4.
      1: {name: XIN,   type: passive}
      2: {name: CASE1, type: passive, note: "case ground"}
      3: {name: XOUT,  type: passive}
      4: {name: CASE2, type: passive, note: "case ground"}

  J3:
    value: USB3-A-Plug
    mpn: "692112030100"
    manufacturer: Wuerth Elektronik
    package: "SMT horizontal"
    footprint: "Connector_USB:USB3_A_Plug_Wuerth_692112030100_Horizontal"
    description: >
      USB 3.0 Type-A plug to the Pi's blue USB 3.0 port. Supplies board power.
      Chosen over USB-C: the Pi 4's USB-C port is USB 2.0 OTG only (~320 Mbit/s
      measured by Olimex with this same PHY), and a USB-C receptacle would need
      a SuperSpeed mux to handle both plug orientations. See OPEN_QUESTIONS.md.
    source: >
      Standard USB 3.0 Type-A pinout, matched against the KiCad-maintained
      footprint for Wuerth 692112030100 (pads 1-9 plus SH shield).
    pins:
      # A connector passes signals through; it neither sources nor sinks them.
      # Everything is passive except VBUS, which really is a power source.
      # Declaring directions here caused 7 ERC errors (output-to-output and
      # undriven-input) on the first run - see OPEN_QUESTIONS.md ERC section.
      1: {name: VBUS,      type: power_out}
      2: {name: D_N,       type: passive}
      3: {name: D_P,       type: passive}
      4: {name: GND,       type: passive}
      # Names and numbers per [USB3] Table 5-2: 5 StdA_SSRX-, 6 StdA_SSRX+,
      # 7 GND_DRAIN, 8 StdA_SSTX-, 9 StdA_SSTX+. [WE-692] (pending a committed
      # copy) lists the same. See design_notes.usb3_crossover.
      5: {name: SSRX_N,    type: passive, note: "[USB3] Table 5-2 StdA_SSRX-; host-side name, host receives, we drive this"}
      6: {name: SSRX_P,    type: passive, note: "[USB3] Table 5-2 StdA_SSRX+; host-side name, host receives, we drive this"}
      7: {name: GND_DRAIN, type: passive}
      8: {name: SSTX_N,    type: passive, note: "[USB3] Table 5-2 StdA_SSTX-; host-side name, host transmits, we receive this"}
      9: {name: SSTX_P,    type: passive, note: "[USB3] Table 5-2 StdA_SSTX+; host-side name, host transmits, we receive this"}
      SH: {name: SHIELD,  type: passive, note: "shield tabs, footprint pad name SH"}

  U6:
    value: SY8089AAAC
    mpn: SY8089AAAC
    manufacturer: Silergy
    package: SOT-23-5
    footprint: "Package_TO_SOT_SMD:SOT-23-5"
    description: "1.0V buck converter for the RTL8153B core rails"
    source: >
      [SY8089] Silergy SY8089/SY8089A datasheet + AN_SY8089. 2.7-5.5V in,
      2A continuous / 3A peak, 1MHz fixed switching frequency.
      Vout = 0.6 x (1 + R1/R2), VREF = 0.588 / 0.600 / 0.612 V.
      Same part Olimex use for this role in their OSHW USB-GIGABIT.
    soft_start:
      tss_ms: 1.2
      uvlo_v: 2.5
      efficiency_assumed: 0.8
      source: >
        Inrush model, check_fab_release.py. [SY8089] page 4, electrical
        characteristics: soft-start time TSS = 1.2 ms (Typ column ONLY; no
        minimum), input UVLO threshold = 2.5 V (Max column ONLY; no minimum or
        typical, hysteresis 0.2 V typ). The model starts U6 at the UVLO maximum
        and ramps its output in the typical TSS; a shorter TSS or an earlier
        start would draw more, and the note publishes neither bound. The
        efficiency of 0.8 is an ASSUMPTION, not a datasheet value (it sets the
        input current for a given output charging current).
    pins:
      1: {name: LX,  type: output,    note: "switch node -> L2"}
      2: {name: GND, type: power_in}
      3: {name: FB,  type: input,     note: "divider midpoint R5/R6"}
      4: {name: IN,  type: power_in}
      5: {name: EN,  type: input,     note: "tie to IN for always-on"}
    design_notes:
      output_voltage: >
        Target 1.000 V. R5 = 10.0k 1% (top, LX side), R6 = 15.0k 1% (bottom,
        to GND): Vout = 0.6 x (1 + 10.0/15.0) = 1.000 V.
        Worst case over VREF tolerance and 1% resistors: 0.972 - 1.028 V,
        inside the 0.95 - 1.05 V window of [RTL-DS] table 21.
        The datasheet recommends 10k...1M for both resistors, so 10k/15k is in
        range.
      do_not_copy_olimex: >
        Olimex use R12 = R15 = 1.1k, a 1:1 ratio, which gives 0.6 x 2 = 1.200 V.
        That suits their RTL8153VC but would over-volt a -VB core rail by 20%.
      inductor: >
        Datasheet formula L = Vout x (1 - Vout/Vin,max) / (Fsw x Iout,max x 40%).
        With Vout = 1.0 V, Vin,max = 5.5 V, Fsw = 1 MHz and a 1 A design point:
        L = 2.05 uH -> 2.2 uH standard value. Independently, this is the value
        Olimex ship. The IC does 2 A continuous, so >=2x headroom.
        The 1.0 V rail current is not specified in [RTL-DS]; 1 A is a
        conservative design point for a GbE PHY core and should be confirmed by
        measurement on the first build.
      feed_forward: >
        A DNP pad, C24, is provided across R5 (output to FB) for a feed-forward
        capacitor. No value is given because none is sourced: this file records
        no [SY8089] figure for it and the SY8089 datasheet is not in
        hardware/datasheets to check, and a number picked now would be a guess
        that looks like a spec. It costs one empty 0603 pad and allows trimming
        transient response or output ripple on the first build with a scope
        rather than a respin. Leave empty until a measurement says otherwise.
      layout: >
        Datasheet: keep CIN, L, R1 and R2 close to the IC, and keep the trace
        from the divider to FB short and away from the switch node.

