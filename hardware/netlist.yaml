  C22:
    value: 100nF
    tolerance: "X7R, 50V, 10%"
    package: "0402"
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    manufacturer: Yageo
    mpn: CC0402KRX7R9BB104
    description: "USB 3.0 SuperSpeed TX AC-coupling, U3SSTXP (13) to J3 pin 6"
    source: >
      USB 3.0 requires the transmitter to be AC coupled with 75-200 nF in
      series, placed at the transmitter. [RTL-DS] is silent on it. [OLIMEX]
      Rev E fit 100nF/X5R/0402 in series in each of U3TX_P and U3TX_N (C1,
      C2). NOT in the earlier netlist; found while verifying usb3_crossover.
      Place close to U3, symmetric with C23, same size and orientation. 100 nF
      +/-10 % X7R stays inside the 75-200 nF window. Package: a 0603 pad is a
      larger impedance discontinuity on a 90 ohm pair than a 0402 pad, it sits
      beside the ESD array U8, and the two legs must stay symmetric, so 0402
      is kept (first raised to 0603 in task 6, restored after review). Part:
      Yageo CC0402KRX7R9BB104, X7R 50V 10%. Part and lifecycle: [SOURCING].
