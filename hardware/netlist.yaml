    package: "0603"
    footprint: "Capacitor_SMD:C_0603_1608Metric"
    manufacturer: Yageo
    mpn: CC0603KRX7R9BB273
    description: "U7 CT pin to GND: sets the +5V_SW rise time"
    source: >
      [TPS22810] table 2: at VIN = 5 V (10-90 % rise, CL = 0.1 uF, CIN = 1 uF)
      CT 10 nF gives 864 us, CT 27 nF gives 2245 us. The formula in 9.3.4 (SR
