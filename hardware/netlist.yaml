  U7:
    value: TPS22810
    mpn: TPS22810DBVR
    manufacturer: Texas Instruments
    package: "SOT-23-6 (DBV), 2.9 x 2.8 mm, leaded"
    footprint: "Package_TO_SOT_SMD:SOT-23-6"
    description: "18V 2A load switch with adjustable rise time: soft-starts +5V_SW from raw VBUS"
    source: >
      [TPS22810] SLVSDH0C. Added in task 6 to limit the attach-time inrush
      (design_notes.vbus_inrush). Chosen over the TPS22918 (same pin-out, 5.5
      V rated, 6 V absolute maximum on VIN, well characterised at 5 V) because
      a hot-plugged USB rail can ring above 6 V and this part is rated 18 V
      (20 V absolute maximum, [TPS22810] 7.1/7.3); it also has an undervoltage
      lock-out (rising 2.54 V, 2.0 to 2.62 V, [TPS22810] 7.5). Cost of that
      choice: the slew is weaker at 5 V, so CT is 27 nF, not 1 nF. Leaded
      SOT-23-6, hand-solderable. Lifecycle and stock: [SOURCING].
    soft_start:
      ct_cap: C26
      swing_fraction: 0.8
      rise_time_us_10_90_at_5v:
        0: 60
        470: 63
        1000: 91
        2200: 198
        4700: 397
        10000: 864
        27000: 2245
      source: >
        [TPS22810] table 2, 'Rise time table', VIN = 5 V column: 10 % to 90 %
        rise time in microseconds against CT in pF, measured with CL = 0.1 uF,
        CIN = 1 uF, RL = 10 ohm. swing_fraction 0.8 is the 10-90 % span of the
        5 V rail (4 V). The table is only valid when VIN is already steady
        before EN is asserted, which is not the case with EN tied to VIN; see
        design_notes.vbus_inrush.
    pins:
      1: {name: VIN,     type: power_in, note: "raw VBUS; 1 uF ceramic close by (C1), [TPS22810] 10.3"}
      2: {name: GND,     type: power_in}
      3: {name: EN_UVLO, type: input,    note: "tied to VIN: always on once VIN passes the 2.54 V UVLO. Rated to 18 V, must not float ([TPS22810] 6)"}
      4: {name: CT,      type: passive,  note: "C26 to GND sets the slew rate"}
      5: {name: QOD,     type: passive,  note: "unused, left open: no output discharge ([TPS22810] 6, 'disabling QOD by leaving pin floating'). The switch is never switched off in service."}
      6: {name: VOUT,    type: power_out, note: "+5V_SW"}

  U8:
    value: SP3019-04HTG
    mpn: SP3019-04HTG
    manufacturer: Littelfuse
    package: "SOT-23-6L, 2.9 x 2.8 mm, leaded"
    footprint: "Package_TO_SOT_SMD:SOT-23-6"
    description: "4-channel 0.3 pF ESD array for the SuperSpeed pairs, at the USB connector"
    source: >
      [SP3019] (committed, md5 54393f11...; see the header): 4 channels, 0.3
      pF typ I/O-to-GND at 3 GHz (page 2 electrical characteristics; no
      maximum published), 0.18 pF I/O-to-I/O, 5 V stand-off, +/-10 kV contact
      / +/-15 kV air IEC 61000-4-2, SOT23-6L leaded and hand-solderable. PIN
      MAP from page 1: the pinout drawing (top view, pins 1 2 3 along the
      bottom, 6 5 4 along the top, pin 1 dot at the bottom left) and the
      functional block diagram, which attaches the four I/O to PIN 1, PIN 3,
      PIN 4, PIN 6 and the ground rail to GND (PIN 2). Pin 5 is on the package
      drawing and not in the diagram, i.e. not connected; the 08/16/22
      revision says so in words ("Note: PIN 5 is NC", search-extracted text).
      The cover calls it an SP3012-family sheet because the SOT23-6L drawing
      is shared with the obsolete SP3012-04HTG. Selection criterion and
      reasons in design_notes.esd_protection: capacitance per line at most 0.5
      pF ([TI-ESD] 4.2, 'less than 0.5pF' for 5 Gbit/s). Replaces the
      SP3012-04HTG, which Littelfuse and DigiKey list as obsolete. Lifecycle
