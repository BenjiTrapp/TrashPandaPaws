      put the modelled peak at 126 mA, over the 100 mA target (design_notes.vbus_inrush). The
      inrush calculation and the guard in check_fab_release.py both depend on
      this value; a +/-10 % X7R part that loses a further 10 % to DC bias (CT
      sees up to 2.5 V, 9.3.4) is covered by the 20 % CT allowance in the model. Part:
      Yageo CC0603KRX7R9BB273, X7R 50V 10%. Part and lifecycle: [SOURCING].
