# The lab's resolver. Mounted read-only into the resolver container; the
# driver prints this file when a run fails, so it is the whole effective
# configuration and nothing is rendered on top of it.

# Forward the zone, and only the zone, to the DNS listener. An IP and not a
# hostname: dnsmasq parses this before it could resolve anything. The
# address and port are listener-dns's in docker-compose.yml, and
# test_e2e_lab fails if they drift apart.
server=/c2.lab/192.0.2.10#8053

# Answer nothing from anywhere else. Every other name is refused rather
# than forwarded, so a query in the log is one the beacon really sent and
# the lab cannot reach a resolver it was not given.
no-resolv
no-hosts

# What the driver asserts on: the query log, in a file because it is read
# with `docker exec` and a stream on stderr would be mixed with dnsmasq's
# own startup lines. A name only appears here if a real resolver parsed it.
log-queries
log-facility=/var/log/dnsmasq/queries.log

# cache-size is deliberately left at dnsmasq's default. The listener
# answers with TTL 1, and a rescue that a cache served twice would be a
# defect worth catching; turning the cache off would hide it.
