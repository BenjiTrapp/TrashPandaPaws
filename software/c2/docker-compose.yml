services:
  raccoon-c2:
    build: .
    container_name: raccoon-c2
    restart: unless-stopped
    network_mode: host
    volumes:
      - raccoon-data:/data/raccoon-c2
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY:-:0}
      # The beacon socket: what implants call back to, on every interface.
      - RACCOON_PORT=8443
      - RACCOON_HOST=0.0.0.0
      # The operator GUI and API, on their own socket and loopback only, so
      # nothing that can reach the beacon socket can reach the GUI. From
      # another machine: ssh -L 8444:127.0.0.1:8444 <user>@<this-host>.
      - RACCOON_OPERATOR_PORT=${RACCOON_OPERATOR_PORT:-8444}
      - RACCOON_OPERATOR_HOST=${RACCOON_OPERATOR_HOST:-127.0.0.1}
      # Where the agent service listens. Loopback, because both containers
      # share the host network: there is no compose network to resolve a
      # service name on, since network_mode: host is required for Responder
      # and the relay tooling.
      - AGENT_URL=${AGENT_URL:-http://127.0.0.1:8099}
      # Shared with the agent below. Empty means the agent service accepts
      # only connections from this machine and nothing else -- which is
      # what loopback already gives it, so leaving it empty is a sane local
      # default and setting it is what an off-box agent needs.
      - RACCOON_AGENT_TOKEN=${RACCOON_AGENT_TOKEN:-}
      # ── RACCOON_TOKEN must be set if the agent is used ──
      # Left unset, the C2 invents a random operator token at every start.
      # The agent authenticates with that token, so it then gets 401 on
      # every call and the GUI reports the agent as unavailable -- or, worse,
      # a campaign starts and sees zero beacons. Neither failure points at
      # the cause. Set it to a fixed value here or in the environment.
      - RACCOON_TOKEN=${RACCOON_TOKEN:-}
      # ── RACCOON_KEY is required ──
      # The base64 32-byte AES-256-GCM key the beacons are configured with.
      # There is no default and nothing is derived from a URL, so the
      # container exits at start, with the server's reason, until this is
      # set in the environment or here. Make one with:
      #   python3 -c "import os,base64; print(base64.b64encode(os.urandom(32)).decode())"
      - RACCOON_KEY=${RACCOON_KEY:-}
      # - RACCOON_SSL=1
      # - RACCOON_CERT=/data/raccoon-c2/cert.pem
      # - RACCOON_CERTKEY=/data/raccoon-c2/key.pem
    cap_add:
      - NET_RAW
      - NET_ADMIN

  # ── The agent service ──
  #
  # Optional. The C2 runs without it and says so in the GUI: the "Automated
  # Attack" button is rendered greyed out with the reason, rather than
  # hidden, so an operator can tell the feature exists and why it is not
  # available. Neither service declares depends_on, in either direction --
  # the C2 must come up without the agent, and the agent must survive a C2
  # that is not there yet.
  agent:
    build:
      # The repository root, so the image can see software/agent. The C2
      # above uses this directory as its context and could not.
      context: ../..
      dockerfile: software/agent/Dockerfile
    container_name: raccoon-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      # The run history, findings, approvals and salience memory. Kept
      # across restarts: the service marks unfinished runs aborted on the
      # way up, and that record is the audit trail.
      - raccoon-agent-data:/data/raccoon-agent
    environment:
      # Loopback only. This API starts campaigns and runs commands; it has
      # no business being reachable from the network, and no port is
      # published for it.
      - AGENT_BIND_HOST=127.0.0.1
      - AGENT_BIND_PORT=8099
      - AGENT_DB_PATH=/data/raccoon-agent/agent.db
      # The operator socket: the agent drives the operator API.
      - AGENT_C2_URL=${AGENT_C2_URL:-http://127.0.0.1:8444}
      # Same value as the C2's above; that is the point of it.
      - RACCOON_TOKEN=${RACCOON_TOKEN:-}
      - RACCOON_AGENT_TOKEN=${RACCOON_AGENT_TOKEN:-}
      # anthropic | openrouter | opencode | local | bedrock
      - AGENT_PROVIDER=${AGENT_PROVIDER:-}
      - AGENT_MODEL=${AGENT_MODEL:-}
      # Never a literal here. Put it in a .env file that is not committed,
      # or export it before `docker compose up`; this repository has a
      # pre-commit hook that refuses credential material in a diff.
      # AGENT_API_KEY_FILE is the alternative and takes a path to a file
      # readable by its owner only.
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_API_KEY_FILE=${AGENT_API_KEY_FILE:-}

  # ── Listeners ──
  #
  # One container per transport, each terminating the protocol the beacon
  # already speaks and relaying opaque ciphertext to the team server's
  # beacon socket. **None of them is given RACCOON_KEY.** They cannot read
  # beacon traffic and cannot forge it; a compromised listener can drop or
  # replay messages and nothing more, and replay is a recorded property of
  # the protocol rather than something this arrangement introduces.
  #
  # Behind a compose profile, so `docker compose up` starts none of them:
  #
  #   docker compose --profile listeners up -d
  #
  # A listener is a socket facing the network and nothing should open one
  # because a file happened to mention it. The profile is the compose
  # equivalent of `enabled: false` in raccoon.yaml, and unlike commenting
  # the services out it leaves them readable and testable.
  #
  # They are not on the host network, unlike the two services above. Port
  # mapping does not exist under `network_mode: host`, and the mapping is
  # the whole mechanism: dockerd holds the privilege for 445 and 53, and
  # the process inside binds something above 1024 as nobody. That is why
  # this package needs no cap_add, no setcap and no sudo anywhere.
  #
  # Being off the host network also means there is no shared compose
  # network and no service name to resolve, so `host-gateway` is the one
  # route back to the team server.

  raccoon-listener-smb:
    profiles: ["listeners"]
    build:
      context: ../..
      dockerfile: software/c2/listeners/Dockerfile
    container_name: raccoon-listener-smb
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "445:8445"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      --transport smb --name smb-445
      --bind-host 0.0.0.0 --bind-port 8445
      --relay-url http://host.docker.internal:8443/api/v1/beacon

  raccoon-listener-quic:
    profiles: ["listeners"]
    build:
      context: ../..
      dockerfile: software/c2/listeners/Dockerfile
    container_name: raccoon-listener-quic
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Not a privileged port, and published anyway rather than bound on the
    # host: a listener that needs no privilege should not be handed the
    # host's whole network namespace to avoid asking for one.
    ports:
      - "8445:8445/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      --transport quic --name quic-8445
      --bind-host 0.0.0.0 --bind-port 8445
      --relay-url http://host.docker.internal:8443/api/v1/beacon

  raccoon-listener-dns:
    profiles: ["listeners"]
    build:
      context: ../..
      dockerfile: software/c2/listeners/Dockerfile
    container_name: raccoon-listener-dns
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "53:8053/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The only secret a listener is given, and it is not the encryption
      # key: it authenticates the tasking route on the team server. DNS
      # carries tasking only -- an agent reached this way will never
      # report a result, and each task is delivered once.
      - RACCOON_LISTENER_TOKEN=${RACCOON_LISTENER_TOKEN:-}
    command: >
      --transport dns --name dns-53
      --bind-host 0.0.0.0 --bind-port 8053
      --setting zone=c2.example.com
      --relay-url http://host.docker.internal:8443

volumes:
  raccoon-data:
  raccoon-agent-data:
